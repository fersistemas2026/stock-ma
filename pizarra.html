<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizarra · Stock MA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#080c10; --surface:#111518; --surface2:#181d22; --border:#232a32;
    --accent:#c8f04a; --text:#eef2f6; --text-muted:#7a8899; --text-dim:#3d4d5c;
    --danger:#ff5a5a; --radius:12px; --font:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
    --nec-bg:#33250e; --nec-bd:#EF9F27; --nec-tx:#FAC775;
    --ten-bg:#1c2e10; --ten-bd:#97C459; --ten-tx:#C0DD97;
    --avi-bg:#24214a; --avi-bd:#AFA9EC; --avi-tx:#CECBF6;
    --stk-bg:#0e2640; --stk-bd:#378ADD; --stk-tx:#B5D4F4;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:var(--font); font-size:14px; min-height:100vh; }
  button { font-family:var(--font); cursor:pointer; }
  input, select, textarea { font-family:var(--font); }
  header { display:flex; align-items:center; gap:14px; padding:0 24px; height:58px; border-bottom:1px solid var(--border); background:var(--surface); position:sticky; top:0; z-index:50; flex-wrap:wrap; }
  .logo { font-family:var(--mono); color:var(--text-muted); font-size:15px; }
  .logo b { color:var(--accent); font-weight:500; }
  .tabs { display:flex; gap:4px; }
  .tab { background:none; border:1px solid transparent; color:var(--text-muted); padding:7px 14px; border-radius:8px; font-size:13px; }
  .tab.active { border-color:var(--border); background:var(--surface2); color:var(--text); font-weight:500; }
  .hdr-right { margin-left:auto; display:flex; align-items:center; gap:10px; }
  .user-badge { font-size:13px; color:var(--text-muted); }
  .user-badge b { color:var(--text); }
  .btn { background:none; border:1px solid var(--border); color:var(--text); padding:7px 14px; border-radius:8px; font-size:13px; transition:all .15s; }
  .btn:hover { border-color:var(--text-muted); }
  .btn-acc { background:var(--accent); border-color:var(--accent); color:#0b0f12; font-weight:700; }
  .btn-acc:hover { background:#a8cc30; }
  .btn-sm { padding:4px 10px; font-size:12px; }
  .sel, .inp { background:var(--surface2); border:1px solid var(--border); border-radius:7px; padding:6px 10px; font-size:13px; color:var(--text); outline:none; }
  .inp:focus, .sel:focus { border-color:var(--text-muted); }
  main { padding:18px 24px 60px; }
  .empty { color:var(--text-muted); text-align:center; padding:40px; font-size:13px; }
  .pill { display:inline-block; font-size:11px; padding:2px 8px; border-radius:6px; font-family:var(--mono); white-space:nowrap; }
  .f-hoy { background:#0c447c; color:#cfe4fa; }
  .f-ayer { background:#7a4a0a; color:#fde3b8; }
  .f-vie { background:#7b1f1f; color:#ffd2d2; }
  .fresh-ok { background:#1f3d10; color:#C0DD97; }
  .fresh-mid { background:#5c3c08; color:#FAC775; }
  .fresh-bad { background:#5e1717; color:#F7C1C1; }
  .st-nueva { background:#3a3f10; color:var(--accent); }
  .st-vista { background:#232a32; color:var(--text); }
  .st-en_camino { background:#0c447c; color:#cfe4fa; }
  .st-resuelta, .st-recibida { background:#1f3d10; color:#C0DD97; }
  .t-nec { background:var(--nec-bg); border-color:var(--nec-bd); color:var(--nec-tx); }
  .t-ten { background:var(--ten-bg); border-color:var(--ten-bd); color:var(--ten-tx); }
  .t-avi { background:var(--avi-bg); border-color:var(--avi-bd); color:var(--avi-tx); }
  .t-stk { background:var(--stk-bg); border-color:var(--stk-bd); color:var(--stk-tx); }
  .legend { display:flex; gap:12px; font-size:12px; color:var(--text-muted); align-items:center; flex-wrap:wrap; }
  .lg { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }

  /* ── Sucursal ── */
  .suc-top { display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
  .suc-top h2 { font-size:18px; font-weight:500; }
  .suc-grid { display:grid; grid-template-columns:190px minmax(0,1fr); gap:12px; }
  .mazo { display:flex; flex-direction:column; gap:6px; }
  .mazo-it { display:flex; justify-content:space-between; align-items:center; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:9px 11px; font-size:13px; cursor:pointer; user-select:none; }
  .mazo-it:hover { border-color:var(--text-muted); }
  .mazo-it .cnt { font-size:11px; color:var(--accent); font-family:var(--mono); }
  .mazo-it.nota { border-style:dashed; color:var(--text-muted); }
  .sboard { position:relative; min-height:540px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:auto; }
  .sboard .empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .card { position:absolute; width:238px; border:1px solid; border-radius:10px; padding-bottom:8px; }
  .card .hd { display:flex; align-items:center; gap:6px; padding:8px 10px; cursor:grab; user-select:none; touch-action:none; font-weight:700; font-size:14px; }
  .card .hd .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .hd select { background:transparent; border:1px solid currentColor; color:inherit; border-radius:6px; font-size:12px; padding:2px 4px; }
  .card .hd select option { background:var(--surface2); color:var(--text); }
  .card .hd .x { background:none; border:1px solid currentColor; color:inherit; border-radius:6px; padding:0 6px; height:22px; }
  .card .rw { display:flex; align-items:center; gap:6px; padding:3px 10px; font-size:13px; }
  .card .rw .g { flex:1; }
  .card .rw input { width:62px; background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.18); border-radius:6px; color:var(--text); padding:4px 6px; font-family:var(--mono); font-size:13px; outline:none; }
  .card .rw .hint { font-size:11px; font-family:var(--mono); min-width:46px; text-align:right; opacity:.85; }
  .card .rw .sug { cursor:pointer; text-decoration:underline dotted; }
  .card .rw.hdr { font-size:10px; text-transform:uppercase; letter-spacing:.05em; opacity:.75; padding-top:0; padding-bottom:0; font-family:var(--mono); }
  .card .rw.hdr span:not(.g) { width:52px; text-align:center; }
  .card .rw input.n2 { width:52px; }
  .card .rw input.pide { border-color:currentColor; font-weight:700; }
  .card .rw input.pide.manual { border-style:dashed; }
  .card .rw input[data-t]::placeholder { font-size:10px; font-style:italic; opacity:.55; }
  .lbl { font-size:11px; opacity:.75; }
  .pit .top .sacar { background:none; border:1px solid currentColor; color:inherit; border-radius:5px; padding:0 5px; font-size:11px; line-height:16px; opacity:.7; }
  .pit .top .sacar:hover { opacity:1; }
  .toast { display:flex; align-items:center; gap:10px; }
  .toast button { background:none; border:1px solid var(--accent); color:var(--accent); border-radius:6px; padding:2px 8px; font-size:12px; white-space:nowrap; }
  .card .ft { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:6px 10px 0; font-size:11px; opacity:.9; }
  .card .ft button { background:none; border:1px solid currentColor; color:inherit; border-radius:6px; padding:2px 8px; font-size:11px; }
  .card textarea { width:calc(100% - 20px); margin:0 10px; min-height:80px; background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.18); border-radius:6px; color:var(--text); padding:6px 8px; font-size:13px; resize:vertical; outline:none; }
  .suc-actions { display:flex; align-items:center; gap:12px; margin-top:12px; flex-wrap:wrap; }
  .sec-title { font-size:15px; font-weight:500; margin:26px 0 10px; display:flex; align-items:center; gap:10px; }
  .mn { border:1px solid; border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .mn .top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; margin-bottom:6px; }
  .mn .it { font-size:13px; line-height:1.6; }
  .mn .resp { margin-top:6px; font-size:13px; padding:6px 8px; background:rgba(0,0,0,.3); border-radius:6px; }
  .mn table { width:100%; border-collapse:collapse; font-size:12px; margin-top:6px; }
  .mn th { text-align:left; font-weight:500; opacity:.8; padding:3px 4px; }
  .mn td { padding:3px 4px; border-top:1px solid rgba(255,255,255,.08); }
  .nuevo-tag { background:var(--accent); color:#0b0f12; font-size:11px; font-weight:700; padding:1px 7px; border-radius:6px; }

  /* ── Central ── */
  .c-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .fresh-strip { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .fresh-strip .fs { font-size:12px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:4px 8px; display:flex; gap:6px; align-items:center; }
  .cboard { position:relative; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:auto; min-height:560px; }
  .pit { position:absolute; width:240px; border:1px solid; border-radius:10px; padding:9px 11px; cursor:grab; user-select:none; touch-action:none; }
  .pit.nueva { border-width:3px; }
  .pit .top { display:flex; justify-content:space-between; align-items:center; gap:6px; font-size:13px; margin-bottom:6px; }
  .pit .it { font-size:12.5px; line-height:1.55; }
  .pit .tx { font-size:12.5px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .pit .ft { display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:6px; }
  .pit .ft button { background:none; border:1px solid currentColor; color:inherit; border-radius:6px; padding:2px 9px; font-size:12px; }
  .pit .resp { margin-top:6px; font-size:12px; opacity:.85; font-style:italic; }

  /* ── Resumen / config ── */
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:14px; }
  .panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; }
  .panel h3 { font-size:14px; font-weight:500; margin-bottom:10px; }
  .tbl { width:100%; border-collapse:collapse; font-size:13px; }
  .tbl th { text-align:left; color:var(--text-muted); font-weight:500; font-size:12px; padding:6px 4px; border-bottom:1px solid var(--border); }
  .tbl td { padding:6px 4px; border-bottom:1px solid var(--border); vertical-align:top; }
  .num { font-family:var(--mono); }

  /* ── Modal / toast ── */
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:flex-start; justify-content:center; padding:50px 16px; z-index:100; overflow:auto; }
  .modal { background:var(--surface); border:1px solid var(--border); border-radius:14px; width:100%; max-width:560px; padding:18px 20px; }
  .modal h3 { font-size:16px; font-weight:500; margin-bottom:4px; }
  .modal .sub { font-size:12px; color:var(--text-muted); margin-bottom:12px; }
  .modal table { width:100%; border-collapse:collapse; font-size:13px; margin:8px 0; }
  .modal th { text-align:left; color:var(--text-muted); font-weight:500; font-size:12px; padding:5px 4px; border-bottom:1px solid var(--border); }
  .modal td { padding:5px 4px; border-bottom:1px solid var(--border); }
  .modal td input { width:70px; }
  .modal textarea { width:100%; min-height:64px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:8px 10px; font-size:13px; resize:vertical; outline:none; margin-top:6px; }
  .modal .acts { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; flex-wrap:wrap; }
  .dif { color:#F09595; font-family:var(--mono); font-size:12px; }
  .ok { color:#97C459; font-family:var(--mono); font-size:12px; }
  #toasts { position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:200; }
  .toast { background:var(--surface2); border:1px solid var(--border); border-left:4px solid var(--accent); padding:10px 14px; border-radius:8px; font-size:13px; max-width:340px; }
  .toast.error { border-left-color:var(--danger); }
  .blocker { position:fixed; inset:0; background:rgba(8,12,16,.94); display:flex; align-items:center; justify-content:center; z-index:300; text-align:center; padding:20px; }
  .blocker .box { max-width:380px; }
  .blocker h2 { font-size:18px; font-weight:500; margin-bottom:8px; }
  .blocker p { color:var(--text-muted); font-size:13px; margin-bottom:16px; }
  /* ── Sesión / personas / tildes ── */
  #ses-bar { display:none; position:sticky; top:58px; z-index:49; background:#3a3f10; color:var(--accent); font-size:13px; padding:8px 24px; align-items:center; gap:12px; border-bottom:1px solid var(--border); }
  #ses-bar.on { display:flex; }
  .personas-bar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:10px; font-size:12px; color:var(--text-muted); }
  .pchip { background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:14px; padding:4px 11px; font-size:12px; cursor:grab; user-select:none; }
  .pchip:hover { border-color:var(--accent); }
  .pit.drop-on { outline:2px dashed var(--accent); outline-offset:3px; }
  .sigue { display:flex; align-items:center; gap:6px; margin:-9px -11px 8px; padding:5px 11px; border-radius:8px 8px 0 0; font-size:12px; font-weight:700; color:#0b0f12; }
  .pit.nueva .sigue { margin:-9px -11px 8px; }
  .sigue .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sigue button { background:none; border:1px solid currentColor; color:inherit; border-radius:5px; padding:0 5px; font-size:11px; line-height:16px; }
  .sigue-tag { font-size:12px; font-weight:700; color:#0b0f12; padding:1px 8px; border-radius:6px; }
  .tk { display:flex; align-items:flex-start; gap:6px; }
  .tk input[type=checkbox] { margin-top:3px; accent-color:var(--accent); cursor:pointer; flex-shrink:0; }
  .tk.hecho > span, .tkrow.hecho td span { text-decoration:line-through; opacity:.55; }
  .tkrow input[type=checkbox] { accent-color:var(--accent); cursor:pointer; }
  .avance { font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:6px; background:rgba(0,0,0,.35); }
  .avance.full { background:#1f3d10; color:#C0DD97; }
  .mazo-sep { font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin:6px 2px 0; }
  @media (max-width:760px) { .suc-grid { grid-template-columns:1fr; } .mazo { flex-direction:row; flex-wrap:wrap; } }
</style>
</head>
<body>
<header>
  <div class="logo">stock<b>MA</b> · pizarra</div>
  <div class="tabs" id="tabs"></div>
  <div class="hdr-right">
    <button class="btn btn-sm" id="btn-sonido" onclick="toggleSonido()" title="Sonido de avisos en el panel principal"></button>
    <span class="user-badge" id="user-badge"></span>
  </div>
</header>
<div id="ses-bar"><span id="ses-bar-txt"></span><button class="btn btn-sm btn-acc" onclick="cambiarUsuario()">Cambiar</button></div>
<main id="app"><div class="empty">Cargando…</div></main>
<div id="modal-root"></div>
<div id="toasts"></div>

<script>
  // ── CONEXIÓN (igual que index.html) ─────────────────────────────────
  const SUPABASE_URL = 'https://brcnctdfbdffxmdypnrh.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJyY25jdGRmYmRmZnhtZHlwbnJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3OTYzMzIsImV4cCI6MjA5NDM3MjMzMn0.t8Ot0v465qdHshX-Ridce42iPpytYjoMoHxR_mBytZQ';
  const DIA_KEYS = ['lunes','martes','miercoles','jueves','viernes','sabado','domingo'];
  const SES_KEY = 'ma_pizarra_sesion';
  const SONIDO_KEY = 'pizarra_sonido';
  const POLL_MS = 20000;
  const TIPOS = { necesito:{cls:'t-nec',label:'Necesito'}, tengo:{cls:'t-ten',label:'Tengo'}, aviso:{cls:'t-avi',label:'Aviso'}, stock:{cls:'t-stk',label:'Stock'} };
  const ESTADOS = { nueva:'Nueva', vista:'Vista', en_camino:'En camino', resuelta:'Resuelta', recibida:'Recibida' };
  const ABIERTOS = ['nueva','vista','en_camino'];

  async function sbApi(path, options = {}) {
    const method = (options.method || 'GET').toUpperCase();
    const headers = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' };
    if (method === 'GET') {
      headers['Prefer'] = 'count=none';
      headers['Range-Unit'] = 'items';
      const PAGE = 1000;
      let offset = 0, all = [];
      while (true) {
        headers['Range'] = `${offset}-${offset + PAGE - 1}`;
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { method, headers });
        if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.message || `Error ${res.status}`); }
        const t = await res.text();
        const page = t ? JSON.parse(t) : [];
        if (!Array.isArray(page)) return page;
        all = all.concat(page);
        if (page.length < PAGE) break;
        offset += PAGE;
      }
      return all;
    }
    if (method === 'POST' || method === 'PATCH') headers['Prefer'] = 'return=representation';
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { method, headers, body: options.body || undefined });
    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.message || `Error ${res.status}`); }
    const t = await res.text();
    return t ? JSON.parse(t) : null;
  }

  // ── UTILIDADES ──────────────────────────────────────────────────────
  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fechaHoyAR() {
    return new Date().toLocaleDateString('es-AR', { timeZone:'America/Argentina/Buenos_Aires', year:'numeric', month:'2-digit', day:'2-digit' }).split('/').reverse().join('-');
  }
  function horaAR() { return new Date().toLocaleTimeString('es-AR', { timeZone:'America/Argentina/Buenos_Aires', hour:'2-digit', minute:'2-digit' }); }
  // Supabase puede devolver "2026-11-18 23:46:17.842" sin zona → se toma como UTC
  function parseTs(s) {
    if (!s) return null;
    let t = String(s).trim().replace(' ', 'T');
    if (!/[zZ]$|[+-]\d\d:?\d\d$/.test(t)) t += 'Z';
    const d = new Date(t);
    return isNaN(d) ? null : d;
  }
  function fechaAR(d) { return d.toLocaleDateString('es-AR', { timeZone:'America/Argentina/Buenos_Aires', year:'numeric', month:'2-digit', day:'2-digit' }).split('/').reverse().join('-'); }
  function diasAtras(ts) {
    const d = parseTs(ts); if (!d) return 99;
    const a = new Date(fechaAR(d) + 'T00:00:00Z'), b = new Date(fechaHoyAR() + 'T00:00:00Z');
    return Math.round((b - a) / 86400000);
  }
  function etiquetaFecha(ts) {
    const d = parseTs(ts); if (!d) return '';
    const n = diasAtras(ts);
    const hora = d.toLocaleTimeString('es-AR', { timeZone:'America/Argentina/Buenos_Aires', hour:'2-digit', minute:'2-digit', hour12:false });
    if (n <= 0) return `<span class="pill f-hoy">Hoy ${hora}</span>`;
    if (n === 1) return `<span class="pill f-ayer">Ayer ${hora}</span>`;
    const f = d.toLocaleDateString('es-AR', { timeZone:'America/Argentina/Buenos_Aires', day:'2-digit', month:'2-digit' });
    return `<span class="pill f-vie">${f} ${hora}</span>`;
  }
  function haceTxt(ts) {
    const d = parseTs(ts); if (!d) return 'sin carga';
    const min = Math.round((Date.now() - d.getTime()) / 60000);
    if (min < 60) return `hace ${Math.max(1, min)} min`;
    const h = Math.round(min / 60);
    if (h < 24) return `hace ${h} h`;
    const dd = Math.round(h / 24);
    return `hace ${dd} ${dd === 1 ? 'día' : 'días'}`;
  }
  function frescuraPill(ts) {
    const d = parseTs(ts);
    if (!d) return '<span class="pill fresh-bad">Stock sin cargar</span>';
    const h = (Date.now() - d.getTime()) / 3600000;
    const cls = h < 12 ? 'fresh-ok' : h < 48 ? 'fresh-mid' : 'fresh-bad';
    return `<span class="pill ${cls}">Stock ${haceTxt(ts)}</span>`;
  }
  function hace7dias() { return new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 19) + 'Z'; }
  // accion opcional: { label, fn } → botón dentro del aviso (ej. "Deshacer")
  function toast(msg, type = 'success', accion = null) {
    const el = document.createElement('div');
    el.className = 'toast' + (type === 'error' ? ' error' : '');
    const sp = document.createElement('span'); sp.textContent = msg; el.appendChild(sp);
    if (accion) {
      const b = document.createElement('button'); b.textContent = accion.label;
      b.onclick = () => { el.remove(); accion.fn(); };
      el.appendChild(b);
    }

  // ── Avisos con la ventana minimizada: título + sonido ──
  const TITULO_BASE = 'Pizarra · Stock MA';
  function ponerTitulo(n, txt) { document.title = n ? `(${n}) ${txt} · ${TITULO_BASE}` : TITULO_BASE; }
  function ventanaActiva() { return document.visibilityState === 'visible' && document.hasFocus(); }
  // Si el sistema (index.html) está abierto, el sonido lo da el panel principal.
  // La pizarra suena sola solo cuando index está cerrado, para no sonar doble.
  function beep() {
    if (localStorage.getItem(SONIDO_KEY) === 'off' || leerSesion()) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.18].forEach(t0 => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, ctx.currentTime + t0);
        g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t0 + 0.15);
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime + t0); o.stop(ctx.currentTime + t0 + 0.16);
      });
      setTimeout(() => ctx.close(), 600);
    } catch (e) {}
  }
  // Texto de cada ítem dejando claro qué es cada número
  function cantTxt(tipo, i) {
    const u = i.unidad ? ' ' + esc(i.unidad) : '';
    if (tipo === 'tengo') return `<span class="lbl">sobra</span> <b>${esc(i.cant)}</b>${u}`;
    if (tipo === 'necesito') return `<span class="lbl">pide</span> <b>${esc(i.cant)}</b>${u}${i.tiene != null ? ` <span class="lbl">· tiene ${esc(i.tiene)}${u}</span>` : ''}`;
    return `<b>${esc(i.cant)}</b>${u}`;
  }
  function parseDatos(n) {
    if (!n.datos) return {};
    if (typeof n.datos === 'object') return n.datos;
    try { return JSON.parse(n.datos); } catch (e) { return {}; }
  }
  function todayKey() { const d = new Date().getDay(); return DIA_KEYS[d === 0 ? 6 : d - 1]; }
  const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('pizarra_ma') : null;
  function avisarCambio() { try { bc && bc.postMessage({ tipo:'update' }); } catch (e) {} }
  // Otra ventana de la pizarra avisó un cambio → refrescar ya (sin esperar los 20 s)
  let bcTimer = null;

  // ── ESTADO ──────────────────────────────────────────────────────────
  let empresaActual = '1';
  let user = null, esAdmin = false, esCentral = false;
  let pdvs = [], prods = [], asigs = [], misPdvs = [];
  let pdvActual = null, tabActual = null;
  let modalAbierto = false, arrastrando = false, pollTimer = null;
  // sucursal
  let sCards = [], sZ = 10, sSeq = 0, stockMap = {}, refMap = {};
  // Sugerido: promedio de lo vendido los últimos REF_SEMANAS días iguales al de MAÑANA
  // (el pedido se hace a la noche para vender al día siguiente). Sin encargos.
  // Se saltean los días en que la sucursal no vendió nada (feriado / cerrado).

  function pdvNombre(id) { const p = pdvs.find(x => String(x.id) === String(id)); return p ? (p.nombre || p.name || id) : id; }
  function prodsDePdv(pdvId) {
    // Si el admin eligió productos para la pizarra, se muestran esos (en todas las sucursales).
    // Si no eligió ninguno, queda como antes: los asignados a la sucursal que tengan gustos.
    const elegidos = prods.filter(p => p.en_pizarra);
    if (elegidos.length) return elegidos;
    const ids = asigs.filter(a => String(a.pdv_id) === String(pdvId)).map(a => String(a.producto_id));
    const base = ids.length ? prods.filter(p => ids.includes(String(p.id))) : prods;
    return base.filter(p => p.gustos.length);
  }
  // Producto sin gustos → una sola fila de cantidad (gusto_id vacío)
  function filasDe(prod) { return prod.gustos.length ? prod.gustos : [{ id: '', nombre: '' }]; }
  function nomItem(i) { return `${i.prod}${i.gusto ? ' ' + i.gusto : ''}`; }

  // ── TILDES DE ARMADO (central) ──
  // Claves: 'i<n>' = ítem n de la tarjeta de producto · 't<n>' = renglón n del texto de la nota
  function lineasTexto(texto) { return String(texto || '').split('\n').map((l, ix) => ({ ix, l: l.trim() })).filter(x => x.l); }
  function tildesDe(n) {
    let t = n.tildes;
    if (typeof t === 'string') { try { t = JSON.parse(t); } catch (e) { t = []; } }
    return Array.isArray(t) ? t.map(String) : [];
  }
  function avanceDe(n) {
    const d = parseDatos(n);
    const claves = [...(d.items || []).map((_, ix) => 'i' + ix), ...lineasTexto(d.texto).map(x => 't' + x.ix)];
    const t = tildesDe(n);
    return { hechos: claves.filter(k => t.includes(k)).length, total: claves.length };
  }
  function avancePill(n) {
    const a = avanceDe(n);
    if (!a.total || !a.hechos) return '';
    return `<span class="avance${a.hechos === a.total ? ' full' : ''}">✓ ${a.hechos}/${a.total}</span>`;
  }
  async function toggleTilde(id, clave, marcado) {
    const n = cNotas.find(x => String(x.id) === String(id)); if (!n) return;
    try {
      // Se lee lo último guardado para no pisar lo que tildó otra persona
      const r = await sbApi(`pedidos_envio?id=eq.${id}&select=tildes`);
      let t = r && r[0] ? tildesDe(r[0]) : tildesDe(n);
      t = t.filter(k => k !== clave);
      if (marcado) t.push(clave);
      await sbApi(`pedidos_envio?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ tildes: t }) });
      n.tildes = t;
      document.querySelectorAll(`[data-tk="${id}|${clave}"]`).forEach(cb => { cb.checked = marcado; cb.closest('.tk,.tkrow')?.classList.toggle('hecho', marcado); });
      const av = document.getElementById('m-avance');
      if (av) { const a = avanceDe(n); av.textContent = `✓ ${a.hechos}/${a.total} armado`; av.classList.toggle('full', a.total > 0 && a.hechos === a.total); }
      if (!modalAbierto && tabActual === 'central') renderCentral();
      avisarCambio();
    } catch (e) {
      toast('No se pudo guardar el tilde: ' + e.message, 'error');
      document.querySelectorAll(`[data-tk="${id}|${clave}"]`).forEach(cb => { cb.checked = !marcado; });
    }
  }
  function tkHtml(n, clave, contenido) {
    const on = tildesDe(n).includes(clave);
    return `<div class="tk${on ? ' hecho' : ''}"><input type="checkbox" data-tk="${esc(n.id)}|${clave}" ${on ? 'checked' : ''} title="Tildar al armar"><span>${contenido}</span></div>`;
  }
  function engancharTildes(root) {
    root.querySelectorAll('input[data-tk]').forEach(cb => {
      cb.addEventListener('pointerdown', e => e.stopPropagation());
      cb.onclick = e => e.stopPropagation();
      cb.onchange = () => { const [id, clave] = cb.dataset.tk.split('|'); toggleTilde(id, clave, cb.checked); };
    });

  // ── PERSONAS QUE SIGUEN LAS NOTAS ──
  async function cargarPersonas() {
    personas = await sbApi(`pizarra_personas?empresa_id=eq.${empresaActual}&order=orden.asc,nombre.asc&select=id,nombre`).catch(() => []) || [];
  }
  // Color propio para cada persona (distinto de naranja/verde/violeta de los tipos)
  const COLORES_PERSONA = ['#5DCAF5', '#F28DC0', '#F5D547', '#4FD1C5', '#FF8A80', '#6E9BFF', '#E3E7EB', '#FFB38A'];
  function colorPersona(nombre) {
    if (!nombre) return '';
    let ix = personas.findIndex(p => p.nombre === nombre);
    if (ix < 0) { ix = 0; for (const c of String(nombre)) ix = (ix * 31 + c.charCodeAt(0)) >>> 0; }
    return COLORES_PERSONA[ix % COLORES_PERSONA.length];

  async function asignarSigue(id, nombre) {
    const n = cNotas.find(x => String(x.id) === String(id)); if (!n) return;

  // ── INICIO ──────────────────────────────────────────────────────────
  // index.html renueva su sesión cada 20 s; si pasan 10 min sin renovar, index está cerrado.
  // La pizarra toma esa sesión UNA vez al abrirse y se la guarda en su propia ventana
  // (sessionStorage, sobrevive a F5). Después sigue funcionando aunque se cierre index
  // o se cierre la sesión allí. Si en index entra otro usuario, ofrece "Cambiar".
  const SES_VENCE_MS = 10 * 60 * 1000;
  const SES_WIN_KEY = 'ma_pizarra_sesion_win';
  function leerSesion() {
    try {
      const s = JSON.parse(localStorage.getItem(SES_KEY) || 'null');
      if (!s || !s.username || !s.ts || Date.now() - s.ts > SES_VENCE_MS) return null;
      return s;
    } catch (e) { return null; }
  }
  function leerSesionVentana() {
    try { const s = JSON.parse(sessionStorage.getItem(SES_WIN_KEY) || 'null'); return s && s.username ? s : null; } catch (e) { return null; }
  }
  function guardarSesionVentana(s) {
    try { sessionStorage.setItem(SES_WIN_KEY, JSON.stringify({ username: s.username, empresa: String(s.empresa || '1') })); } catch (e) {}
  }
  function bloquear(titulo, texto) {
    clearInterval(pollTimer);
    document.getElementById('modal-root').innerHTML = '';
    if (document.querySelector('.blocker')) return;
    const b = document.createElement('div');
    b.className = 'blocker';
    b.innerHTML = `<div class="box"><h2>${esc(titulo)}</h2><p>${esc(texto)}</p><button class="btn btn-acc" onclick="window.location.href='index.html'">Ir al sistema</button></div>`;
    document.body.appendChild(b);
  }

  async function init() {
    const ses = leerSesionVentana() || leerSesion();
    if (!ses || !ses.username) { bloquear('Sesión no iniciada', 'Ingresá al sistema y abrí la pizarra desde el botón del panel.'); return; }
    empresaActual = String(ses.empresa || '1');
    try {
      const r = await sbApi(`usuarios?username=eq.${encodeURIComponent(ses.username)}&select=username,role,display_name,perms,pdvs`);
      if (!r || !r.length) { try { sessionStorage.removeItem(SES_WIN_KEY); } catch (e) {} bloquear('Usuario no encontrado', 'Volvé a ingresar al sistema.'); return; }
      guardarSesionVentana(ses);
      const u = r[0];
      user = {
        username: u.username, role: u.role, displayName: u.display_name || u.username,
        perms: typeof u.perms === 'string' ? JSON.parse(u.perms || '{}') : (u.perms || {}),
        pdvs: typeof u.pdvs === 'string' ? JSON.parse(u.pdvs || '[]') : (u.pdvs || [])
      };
      const [pd, pr, gs, as] = await Promise.all([
        sbApi(`pdvs?empresa_id=eq.${empresaActual}&order=orden.asc,created_at.asc&select=*`),
        sbApi(`productos?empresa_id=eq.${empresaActual}&order=orden.asc,created_at.asc&select=*`),
        sbApi(`gustos?select=id,producto_id,nombre,orden&order=orden.asc`),
        sbApi(`asignaciones?empresa_id=eq.${empresaActual}&select=*`),
        cargarPersonas()
      ]);
      pdvs = pd || []; asigs = as || [];
      prods = (pr || []).map(p => ({ ...p, nombre: p.nombre || p.name || '',
        gustos: (gs || []).filter(g => String(g.producto_id) === String(p.id)).map(g => ({ id: g.id, nombre: g.nombre || g.name || '' })) }));
    } catch (e) { bloquear('No se pudo conectar', e.message); return; }

    esAdmin = user.role === 'admin';
    misPdvs = (user.pdvs || []).map(String).filter(id => pdvs.some(p => String(p.id) === id));
    esCentral = esAdmin || misPdvs.some(id => pdvs.find(p => String(p.id) === id)?.pizarra_ve_todas);
    if (!misPdvs.length && !esCentral) { bloquear('Sin acceso a la pizarra', 'Tu usuario no tiene un punto de venta asignado.'); return; }
    pdvActual = misPdvs[0] || null;

    document.getElementById('user-badge').innerHTML = `<b>${esc(user.displayName)}</b>${pdvActual ? ' · ' + esc(pdvNombre(pdvActual)) : ''}`;
    pintarSonido();
    const tabs = [];
    if (esCentral) tabs.push(['central', 'Pizarra central'], ['resumen', 'Resumen y cruce']);
    if (misPdvs.length) tabs.push(['sucursal', esCentral ? 'Mi sucursal' : 'Mi pizarra']);
    if (esAdmin) tabs.push(['config', 'Configuración']);
    document.getElementById('tabs').innerHTML = tabs.map(([k, l]) => `<button class="tab" id="tab-${k}" onclick="irTab('${k}')">${l}</button>`).join('');
    irTab(tabs[0][0]);
    pollTimer = setInterval(poll, POLL_MS);
    window.addEventListener('storage', e => { if (e.key === SES_KEY) chequearSesion(); });
    chequearSesion();
    // Al volver a la ventana: en la sucursal se dan por vistas las novedades; en la central se limpia el aviso
    const alVolver = () => {
      if (!ventanaActiva()) return;
      if (tabActual === 'sucursal' && !modalAbierto) cargarMisNotas().catch(() => {});
    };
    window.addEventListener('focus', alVolver);
    document.addEventListener('visibilitychange', alVolver);
  }

  // Nunca bloquea: si index está cerrado o sin sesión, la pizarra sigue con su usuario.
  // Solo avisa si en index hay OTRO usuario (o empresa) logueado.
  let sesOtra = null;
  function chequearSesion() {
    const s = leerSesion();
    const bar = document.getElementById('ses-bar');
    if (s && user && (s.username !== user.username || String(s.empresa || '1') !== empresaActual)) {
      sesOtra = s;
      document.getElementById('ses-bar-txt').textContent = `En el sistema ahora está logueado ${s.username}${String(s.empresa || '1') !== empresaActual ? ' (otra empresa)' : ''}. La pizarra sigue como ${user.displayName}.`;

  function cambiarUsuario() {
    if (!sesOtra) return;

    guardarSesionVentana(sesOtra);

  async function poll() {
    chequearSesion();
    if (modalAbierto || arrastrando) return;
    try {
      if (tabActual === 'central') await cargarCentral(true);
      else if (tabActual === 'resumen') await cargarResumen();
      else if (tabActual === 'sucursal') await cargarMisNotas();

  function irTab(k) {
    tabActual = k;

    if (k === 'sucursal') renderSucursal();

  function pintarSonido() {

          <div class="mazo-it nota" onclick="abrirNota()"><span>+ Nota libre</span><span>✎</span></div>
        </aside>

  function cambiarPdv(id) {
    // Las tarjetas sin enviar quedan en el borrador de la sucursal anterior
    pdvActual = id;
