  function fechaMenosDias(iso, n) { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() - n); return d.toISOString().slice(0, 10); }
  function fechaCorta(iso) {
    const d = new Date(iso + 'T12:00:00Z');
    return ['dom','lun','mar','mié','jue','vie','sáb'][d.getUTCDay()] + ' ' + iso.slice(8, 10) + '/' + iso.slice(5, 7);
  }
  async function cargarStockPdv() {
    stockMap = {}; refMap = {}; ventaRef = {};
    // Mañana menos 7, 14, 21, 28 días = hoy − 6, − 13, − 20, − 27
    const hoy = fechaHoyAR();
    const candidatas = Array.from({ length: REF_SEMANAS }, (_, i) => fechaMenosDias(hoy, 6 + 7 * i));
    const [st, cfg, vt] = await Promise.all([
      sbApi(`stock?empresa_id=eq.${empresaActual}&pdv_id=eq.${pdvActual}&select=prod_id,gusto_id,cantidad,updated_at`).catch(() => []),
      sbApi(`stock_config?empresa_id=eq.${empresaActual}&pdv_id=eq.${pdvActual}&dia=eq.${todayKey()}&select=prod_id,gusto_id,referencia`).catch(() => []),
      // Ventas de esos días, sin los encargos (ticket ENC_…)
      sbApi(`ventas?empresa_id=eq.${empresaActual}&pdv_id=eq.${pdvActual}&fecha=in.(${candidatas.join(',')})&or=(ticket_id.is.null,ticket_id.not.like.ENC_*)&select=fecha,prod_id,gusto_id,cantidad`).catch(() => [])
    ]);
    // Solo cuentan los días en que hubo ventas (si estuvo cerrado no baja el promedio)
    const conVentas = new Set((vt || []).filter(r => (parseFloat(r.cantidad) || 0) > 0).map(r => String(r.fecha).slice(0, 10)));
    ventaRefFechas = candidatas.filter(f => conVentas.has(f));
    const nDias = ventaRefFechas.length;
    (vt || []).forEach(r => {
      if (!conVentas.has(String(r.fecha).slice(0, 10))) return;
      const k = `${r.prod_id}_${r.gusto_id || ''}`;
      ventaRef[k] = (ventaRef[k] || 0) + (parseFloat(r.cantidad) || 0);
    });
    if (nDias) Object.keys(ventaRef).forEach(k => { ventaRef[k] = ventaRef[k] / nDias; });
    const diaNom = fechaCorta(candidatas[0]).split(' ')[0];
    ventaRefTxt = nDias ? `prom. ${nDias} ${diaNom}` : `sin ventas los ${diaNom}`;
    let ult = null;
    (st || []).forEach(r => {
      stockMap[`${r.prod_id}_${r.gusto_id}`] = { cant: parseInt(r.cantidad) || 0, ts: r.updated_at };
      const d = parseTs(r.updated_at); if (d && (!ult || d > ult)) ult = d;
    });
    (cfg || []).forEach(r => { if (r.referencia != null) refMap[`${r.prod_id}_${r.gusto_id}`] = parseInt(r.referencia) || 0; });
    const f = document.getElementById('suc-fresh');
    if (f) f.innerHTML = frescuraPill(ult ? ult.toISOString() : null);
  }

  function vendidoRef(prodId, gustoId) { return Math.round(ventaRef[`${prodId}_${gustoId}`] || 0); }
  function sugeridoPide(prodId, gustoId, tiene) { return Math.max(vendidoRef(prodId, gustoId) - (parseInt(tiene) || 0), 0); }
  function sugerido(tipo, prodId, gustoId) {
    const k = `${prodId}_${gustoId}`;
    if (!(k in refMap)) return null;
    const actual = stockMap[k]?.cant ?? 0;
    const v = tipo === 'necesito' ? refMap[k] - actual : actual - refMap[k];
    return v > 0 ? v : null;
  }

  function posLibre() {
    const n = sCards.length;
    const board = document.getElementById('sboard');
    const cols = Math.max(1, Math.floor((board.clientWidth - 12) / 250));
    return [12 + (n % cols) * 250, 12 + Math.floor(n / cols) * 250];
  }

  function crearCardEl(clsTipo, inner) {
    document.getElementById('s-empty')?.remove();
    const el = document.createElement('div');
    el.className = 'card ' + clsTipo;
    const [x, y] = posLibre();
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.zIndex = ++sZ;
    el.innerHTML = inner;
    document.getElementById('sboard').appendChild(el);
    arrastrable(el, el.querySelector('.hd'), document.getElementById('sboard'), () => guardarBorrador());
    return el;
  }

  function tiposDe(prod) { return prod && prod.gustos.length ? ['necesito', 'tengo', 'stock'] : ['necesito', 'tengo']; }
  function tipoLibre(prodId) {
    const prod = prods.find(p => String(p.id) === String(prodId));
    for (const t of tiposDe(prod)) if (!sCards.some(c => c.kind === 'prod' && c.prodId === prodId && c.tipo === t)) return t;
    return null;
  }

  function abrirTarjeta(prodId, tipoForzado) {
    const prod = prods.find(p => String(p.id) === String(prodId)); if (!prod) return null;
    const tipo = (tipoForzado && tiposDe(prod).includes(tipoForzado) && !sCards.some(c => c.kind === 'prod' && c.prodId === String(prodId) && c.tipo === tipoForzado))
      ? tipoForzado : tipoLibre(String(prodId));
    if (!tipo) { toast('Esa tarjeta ya está abierta en todos los tipos', 'error'); return null; }
    const id = 'c' + (++sSeq);
    const el = crearCardEl(TIPOS[tipo].cls, `
      <div class="hd"><span class="nm" title="${esc(prod.nombre)}">${esc(prod.nombre)}</span>
        <select aria-label="Tipo de tarjeta">${tiposDe(prod).map(t => `<option value="${t}" ${t === tipo ? 'selected' : ''}>${TIPOS[t].label}</option>`).join('')}</select>
        <button class="x" title="Cerrar" aria-label="Cerrar">✕</button></div>
      <div class="rows"></div><div class="ft"></div>`);
    const card = { id, kind: 'prod', prodId: String(prodId), tipo, el };
    sCards.push(card);
    const sel = el.querySelector('select');
    sel.onchange = () => {
      const nuevo = sel.value;
      if (sCards.some(c => c !== card && c.kind === 'prod' && c.prodId === card.prodId && c.tipo === nuevo)) {
        toast(`Ya tenés abierta ${prod.nombre} como ${TIPOS[nuevo].label}`, 'error'); sel.value = card.tipo; return;
      }
      card.tipo = nuevo; el.className = 'card ' + TIPOS[nuevo].cls; pintarFilas(card); resumenSucursal();
    };
    el.querySelector('.x').onclick = () => cerrarCard(card);
    pintarFilas(card);
    resumenSucursal();
    if (!restaurando) el.querySelector('input')?.focus();
    return card;
  }

  function pintarFilas(card) {
    const prod = prods.find(p => String(p.id) === card.prodId);
    const u = prod.unidad ? ` ${esc(prod.unidad)}` : '';
    const rows = card.el.querySelector('.rows'), ft = card.el.querySelector('.ft');
    rows.innerHTML = filasDe(prod).map(g => {
      const k = `${prod.id}_${g.id}`;
      if (card.tipo === 'stock') {
        const act = stockMap[k];
        return `<div class="rw"><span class="g">${esc(g.nombre)}</span><input type="number" min="0" step="1" data-g="${esc(g.id)}" value="${act ? act.cant : ''}" placeholder="0"><span class="hint">${act ? 'antes ' + act.cant : 'sin dato'}</span></div>`;
      }
      if (card.tipo === 'necesito') {
        const vend = vendidoRef(prod.id, g.id), sug = sugeridoPide(prod.id, g.id, 0);
        const act = stockMap[k];
        // El gris de fondo de "Tiene" es el stock anterior ("ant."), no un valor cargado
        return `<div class="rw" title="Vendió ${vend} (${ventaRefTxt})${act ? ' · stock anterior ' + act.cant : ''}"><span class="g">${esc(g.nombre || 'Cantidad')}</span><input class="n2" type="number" min="0" step="1" data-t="${esc(g.id)}" placeholder="${act ? 'ant.' + act.cant : '—'}"><input class="n2 pide" type="number" min="0" step="1" data-g="${esc(g.id)}" data-vend="${vend}" value="${sug || ''}" placeholder="0"></div>`;
      }
      const s = sugerido(card.tipo, prod.id, g.id);
      return `<div class="rw"><span class="g">${esc(g.nombre || 'Cantidad')}</span><input type="number" min="0" step="1" data-g="${esc(g.id)}" placeholder="0"><span class="hint">${s != null ? `<span class="sug" data-s="${s}" title="Usar sugerido">sug. ${s}</span>` : ''}</span></div>`;
    }).join('');
    rows.querySelectorAll('.sug').forEach(sp => sp.onclick = () => { sp.closest('.rw').querySelector('input').value = sp.dataset.s; resumenSucursal(); });
    rows.querySelectorAll('input').forEach(i => i.oninput = resumenSucursal);
    if (card.tipo === 'necesito') {
      rows.insertAdjacentHTML('afterbegin', '<div class="rw hdr"><span class="g"></span><span>Tiene</span><span>Pide</span></div>');
      rows.querySelectorAll('input[data-t]').forEach(t => {
        const pide = t.closest('.rw').querySelector('input.pide');
        // Al cargar lo que tiene, el sugerido se recalcula (salvo que el operador lo haya cambiado a mano)
        t.oninput = () => {
          if (!pide.classList.contains('manual')) { const v = Math.max((parseInt(pide.dataset.vend) || 0) - (parseInt(t.value) || 0), 0); pide.value = v || ''; }
          resumenSucursal();
        };
      });
      rows.querySelectorAll('input.pide').forEach(i => i.oninput = () => { i.classList.add('manual'); resumenSucursal(); });
      ft.innerHTML = `<span>Sugerido: vendido (${esc(ventaRefTxt)}) − lo que tiene${u ? ' ·' + u : ''}</span><button title="Volver al sugerido">↺</button>`;
      ft.querySelector('button').onclick = () => {
        rows.querySelectorAll('input.pide').forEach(i => { i.classList.remove('manual'); const t = i.closest('.rw').querySelector('input[data-t]'); const v = Math.max((parseInt(i.dataset.vend) || 0) - (parseInt(t.value) || 0), 0); i.value = v || ''; });
        resumenSucursal();
      };
      return;
    }
    if (card.tipo === 'stock') {
      ft.innerHTML = `<span>Se guarda al enviar${u ? ' ·' + u : ''}</span>`;
    } else {
      const haySug = rows.querySelector('.sug');
      ft.innerHTML = `<span>${u ? 'Unidad:' + u : ''}</span>${haySug ? '<button>Usar sugeridos</button>' : ''}`;
      const b = ft.querySelector('button');
      if (b) b.onclick = () => { rows.querySelectorAll('.sug').forEach(sp => sp.closest('.rw').querySelector('input').value = sp.dataset.s); resumenSucursal(); };
    }
  }

  function abrirNota(tipoIni, textoIni) {
    const id = 'c' + (++sSeq);
    const tipo0 = ['necesito', 'tengo', 'aviso'].includes(tipoIni) ? tipoIni : 'aviso';
    const el = crearCardEl(TIPOS[tipo0].cls, `
      <div class="hd"><span class="nm">Nota</span>
        <select aria-label="Tipo de nota">${['necesito', 'tengo', 'aviso'].map(t => `<option value="${t}" ${t === tipo0 ? 'selected' : ''}>${TIPOS[t].label}</option>`).join('')}</select>
        <button class="x" title="Cerrar" aria-label="Cerrar">✕</button></div>
      <textarea placeholder="Escribí lo que necesites avisar">${esc(textoIni || '')}</textarea>`);
    const card = { id, kind: 'nota', tipo: tipo0, el };
    sCards.push(card);
    const sel = el.querySelector('select');
    sel.onchange = () => { card.tipo = sel.value; el.className = 'card ' + TIPOS[sel.value].cls; resumenSucursal(); };
    el.querySelector('.x').onclick = () => cerrarCard(card);
    el.querySelector('textarea').oninput = resumenSucursal;
    if (!restaurando) el.querySelector('textarea').focus();
    resumenSucursal();
    return card;
  }

  // ── BORRADOR: las tarjetas sin enviar se guardan en este navegador ──
  // Por usuario y sucursal. Si se cierra la ventana o se aprieta F5, se recuperan.
  // Un borrador de otro día se descarta (las cantidades ya no sirven).
  function claveBorrador() { return `pizarra_borrador_${empresaActual}_${user?.username}_${pdvActual}`; }
  function guardarBorrador() {
    if (restaurando || !user || !pdvActual) return;
    const cards = sCards.map(c => {
      const base = { kind: c.kind, tipo: c.tipo, x: c.el.offsetLeft, y: c.el.offsetTop };
      if (c.kind === 'nota') return { ...base, texto: c.el.querySelector('textarea').value };
      const vals = {};
      c.el.querySelectorAll('.rows input[data-g]').forEach(i => {
        const t = c.el.querySelector(`.rows input[data-t="${CSS.escape(i.dataset.g)}"]`);
        vals[i.dataset.g] = { p: i.value, m: i.classList.contains('manual'), t: t ? t.value : '' };
      });
      return { ...base, prodId: c.prodId, vals };
    });
    try {
      if (cards.length) localStorage.setItem(claveBorrador(), JSON.stringify({ fecha: fechaHoyAR(), hora: horaAR(), cards }));
      else localStorage.removeItem(claveBorrador());
    } catch (e) {}
  }
  function borrarBorrador() { try { localStorage.removeItem(claveBorrador()); } catch (e) {} }
  function restaurarBorrador() {
    let b = null;
    try { b = JSON.parse(localStorage.getItem(claveBorrador()) || 'null'); } catch (e) {}
    if (!b || !Array.isArray(b.cards) || !b.cards.length) return;
    if (b.fecha !== fechaHoyAR()) { borrarBorrador(); return; }
    restaurando = true;
    try {
      b.cards.forEach(bc => {
        const card = bc.kind === 'nota' ? abrirNota(bc.tipo, bc.texto) : abrirTarjeta(bc.prodId, bc.tipo);
        if (!card) return;
        if (bc.x != null) { card.el.style.left = bc.x + 'px'; card.el.style.top = bc.y + 'px'; }
        if (card.kind !== 'prod') return;
        card.el.querySelectorAll('.rows input[data-g]').forEach(i => {
          const v = bc.vals?.[i.dataset.g]; if (!v) return;
          const t = card.el.querySelector(`.rows input[data-t="${CSS.escape(i.dataset.g)}"]`);
          if (t) t.value = v.t || '';
          if (card.tipo === 'necesito' && !v.m) {
            // Sugerido recalculado con lo que tiene (el promedio puede haber cambiado)
            const s = Math.max((parseInt(i.dataset.vend) || 0) - (parseInt(t?.value) || 0), 0);
            i.value = s || '';
          } else {
            i.value = v.p || '';
            if (v.m) i.classList.add('manual');
          }
        });
      });
    } finally { restaurando = false; }
    if (sCards.length) toast(`📝 Se recuperaron ${sCards.length} tarjetas sin enviar (${b.hora})`);
  }

  function cerrarCard(card) {
    card.el.remove();
    sCards = sCards.filter(c => c !== card);
    if (!sCards.length) document.getElementById('sboard').innerHTML = '<div class="empty" id="s-empty">Elegí una tarjeta de la izquierda</div>';
    resumenSucursal();
  }

  // Lo que el operador cargó en "Tiene" en una tarjeta Necesito (se guarda como stock)
  function tieneDeCard(card) {
    const out = [];
    if (card.kind !== 'prod' || card.tipo !== 'necesito') return out;
    card.el.querySelectorAll('.rows input[data-t]').forEach(i => {
      if (i.value === '') return;
      const v = parseInt(i.value);
      if (isNaN(v) || v < 0) return;
      out.push({ prod_id: card.prodId, gusto_id: String(i.dataset.t), cant: String(v) });
    });
    return out;
  }
  function itemsDeCard(card) {
    const prod = prods.find(p => String(p.id) === card.prodId);
    const items = [];
    card.el.querySelectorAll('.rows input:not([data-t])').forEach(i => {
      if (i.value === '') return;
      const v = parseInt(i.value);
      if (isNaN(v) || v < 0) return;
      if (card.tipo !== 'stock' && v === 0) return;
      const g = prod.gustos.find(x => String(x.id) === i.dataset.g);
      const it = { prod: prod.nombre, gusto: g ? g.nombre : '', cant: String(v), obs: '', obsProd: '', prod_id: String(prod.id), gusto_id: String(i.dataset.g), unidad: prod.unidad || '' };
      if (card.tipo === 'necesito') {
        const t = i.closest('.rw').querySelector('input[data-t]');
        if (t && t.value !== '') it.tiene = String(parseInt(t.value) || 0);
        it.vendio = String(parseInt(i.dataset.vend) || 0);
        it.sugerido = String(Math.max((parseInt(i.dataset.vend) || 0) - (parseInt(t?.value) || 0), 0));
        it.ref_txt = ventaRefTxt;
        it.ref_fechas = ventaRefFechas;
      }
      items.push(it);
    });
    return items;
  }

  // Gustos de una tarjeta Necesito con "Tiene" cargado pero sin pedido:
  // no van como ítem a armar, pero viajan en la nota para que la central los vea.
  function informaDeCard(card) {
    if (card.kind !== 'prod' || card.tipo !== 'necesito') return [];
    const prod = prods.find(p => String(p.id) === card.prodId);
    const out = [];
    card.el.querySelectorAll('.rows input[data-t]').forEach(t => {
      if (t.value === '') return;
      const pide = t.closest('.rw').querySelector('input.pide');
      if (pide && (parseInt(pide.value) || 0) > 0) return;
      const g = prod.gustos.find(x => String(x.id) === String(t.dataset.t));
      out.push({ prod: prod.nombre, gusto: g ? g.nombre : '', tiene: String(parseInt(t.value) || 0), unidad: prod.unidad || '' });
    });
    return out;
  }

  function resumenSucursal() {
    const el = document.getElementById('s-res'); if (!el) return;
    let nec = 0, ten = 0, stk = 0, notas = 0;
    sCards.forEach(c => {
      if (c.kind === 'nota') { if (c.el.querySelector('textarea').value.trim()) notas++; return; }
      const n = itemsDeCard(c).length;
      if (c.tipo === 'necesito') { nec += n; stk += tieneDeCard(c).length; } else if (c.tipo === 'tengo') ten += n; else stk += n;
    });
    el.textContent = `${sCards.length} tarjetas abiertas · ${nec} necesito · ${ten} tengo · ${stk} stock · ${notas} notas`;
    guardarBorrador();
    prodsDePdv(pdvActual).forEach(p => {
      const m = document.getElementById('mz-' + p.id);
      if (m) { const n = sCards.filter(c => c.kind === 'prod' && c.prodId === String(p.id)).length; m.textContent = n ? '● ' + n : ''; }
    });
  }

  async function setStockPizarra(prodId, gustoId, cantidad) {
    // Misma lógica que setStock() de index.html (DELETE + INSERT) + historial con usuario y origen
    const eId = String(empresaActual), pdvStr = String(pdvActual), cant = parseInt(cantidad) || 0;
    const H = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' };
    const del = await fetch(`${SUPABASE_URL}/rest/v1/stock?empresa_id=eq.${eId}&pdv_id=eq.${pdvStr}&prod_id=eq.${prodId}&gusto_id=eq.${gustoId}`, { method: 'DELETE', headers: H });
    if (!del.ok) throw new Error('No se pudo borrar el stock anterior: ' + await del.text());
    // Si el INSERT falla después del DELETE, ese gusto quedaría sin stock → se reintenta
    const body = JSON.stringify({ empresa_id: eId, pdv_id: pdvStr, prod_id: String(prodId), gusto_id: String(gustoId), cantidad: cant, updated_at: new Date().toISOString() });
    let ultErr = '';
    for (let intento = 0; intento < 3; intento++) {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/stock`, { method: 'POST', headers: { ...H, 'Prefer': 'return=minimal' }, body });
        if (res.ok) { ultErr = ''; break; }
        ultErr = await res.text();
      } catch (e) { ultErr = e.message; }
      await new Promise(r => setTimeout(r, 500 * (intento + 1)));
    }
    if (ultErr) throw new Error(ultErr);
    try {
      const pdv = pdvs.find(p => String(p.id) === pdvStr || String(p.orden) === pdvStr);
      await sbApi('stock_historial', { method: 'POST', body: JSON.stringify({
        empresa_id: eId, pdv_id: pdv?.id || pdvStr, prod_id: String(prodId), gusto_id: String(gustoId),
        cantidad: cant, fecha: fechaHoyAR(), username: user.username, origen: 'pizarra' }) });
    } catch (e) { /* no crítico, igual que index */ }
  }

  async function enviarPizarra(btn) {
    const filas = [];
    // Stock a guardar: primero lo de "Tiene" y después la tarjeta Stock, que manda si están los dos
    const stockPorClave = new Map();
    for (const c of sCards) {
      if (c.kind === 'nota') {
        const t = c.el.querySelector('textarea').value.trim();
        if (t) filas.push({ tipo: c.tipo, items: [], texto: t });
      } else if (c.tipo !== 'stock') {
        const items = itemsDeCard(c);
        if (items.length) filas.push({ tipo: c.tipo, items, texto: '', informa: informaDeCard(c) });
        tieneDeCard(c).forEach(it => stockPorClave.set(`${it.prod_id}_${it.gusto_id}`, it));
      }
    }
    sCards.filter(c => c.kind === 'prod' && c.tipo === 'stock').forEach(c => itemsDeCard(c).forEach(it => stockPorClave.set(`${it.prod_id}_${it.gusto_id}`, it)));
    const stockItems = [...stockPorClave.values()];
    if (!filas.length && !stockItems.length) { toast('Cargá al menos una cantidad o escribí una nota', 'error'); return; }
    // Si tiene tarjetas Necesito con "Tiene" vacío en algún gusto, avisar (ese gusto no actualiza stock)
    const sinTiene = sCards.filter(c => c.kind === 'prod' && c.tipo === 'necesito').reduce((s, c) => s + [...c.el.querySelectorAll('.rows input[data-t]')].filter(i => i.value === '').length, 0);
    if (sinTiene && !confirm(`Hay ${sinTiene} gustos sin cargar en "Tiene". Esos no actualizan el stock. ¿Enviar igual?`)) return;
    btn.disabled = true; btn.textContent = 'Enviando…';
    try {
      const fecha = fechaHoyAR(), hora = horaAR(), pdvN = pdvNombre(pdvActual);
      if (filas.length) {
        const body = filas.map(f => ({
          empresa_id: String(empresaActual), pdv_id: String(pdvActual), pdv_nombre: pdvN, fecha, archivado: false,
          tipo: f.tipo, estado: 'nueva', usuario: user.username,
          datos: JSON.stringify({ pdv_id: String(pdvActual), pdv_nombre: pdvN, fecha, hora, usuario: user.username, items: f.items, texto: f.texto, informa: f.informa || [], origen: 'pizarra' })
        }));
        await sbApi('pedidos_envio', { method: 'POST', body: JSON.stringify(body) });
      }
      // Stock de a tandas de 5 en paralelo (antes era de a uno)
      let errStock = 0;
      for (let i = 0; i < stockItems.length; i += 5) {
        const tanda = stockItems.slice(i, i + 5);
        btn.textContent = `Guardando stock ${Math.min(i + 5, stockItems.length)}/${stockItems.length}…`;
        const res = await Promise.allSettled(tanda.map(it => setStockPizarra(it.prod_id, it.gusto_id, it.cant)));
        res.forEach(r => { if (r.status === 'rejected') { errStock++; console.error(r.reason); } });
      }
      borrarBorrador();
      const partes = [];
      if (filas.length) partes.push(`${filas.length} ${filas.length === 1 ? 'nota enviada' : 'notas enviadas'}`);
      if (stockItems.length) partes.push(`stock de ${stockItems.length - errStock} gustos guardado`);
      toast('✅ ' + partes.join(' y '));
      if (errStock) toast(`⚠️ No se pudo guardar el stock de ${errStock} gustos`, 'error');
      avisarCambio();
      await renderSucursal();
    } catch (e) {
      toast('Error al enviar: ' + e.message, 'error');
      btn.disabled = false; btn.textContent = 'Enviar pizarra';
    }
  }

  // ── Mis notas (sucursal) ──
  async function cargarMisNotas() {
    const cont = document.getElementById('misnotas'); if (!cont || !pdvActual) return;
    const notas = await sbApi(`pedidos_envio?empresa_id=eq.${empresaActual}&pdv_id=eq.${pdvActual}&or=(estado.in.(nueva,vista,en_camino),created_at.gte.${hace7dias()})&order=created_at.desc&select=*`) || [];
    const ids = notas.map(n => n.id);
    const envios = ids.length ? (await sbApi(`pedidos?empresa_id=eq.${empresaActual}&nota_id=in.(${ids.join(',')})&select=*`) || []) : [];
    const porNota = {}; envios.forEach(e => (porNota[e.nota_id] = porNota[e.nota_id] || []).push(e));
    if (!notas.length) { cont.innerHTML = '<div class="empty">Todavía no enviaste notas.</div>'; return; }
    const conNovedad = notas.filter(n => n.novedad_sucursal).map(n => n.id);
    cont.innerHTML = notas.map(n => {
      const d = parseDatos(n), t = TIPOS[n.tipo] || TIPOS.necesito;
      const env = porNota[n.id] || [];
      const items = (d.items || []).map(i => `<div class="it">• ${esc(nomItem(i))} · ${cantTxt(n.tipo, i)}</div>`).join('');
      const tablaEnv = env.length ? `<table><tr><th>Enviado</th><th>Cant.</th><th>Recibido</th></tr>${env.map(e => {
        const it = (d.items || []).find(i => String(i.prod_id) === String(e.prod_id) && String(i.gusto_id) === String(e.gusto_id));
        const nom = it ? `${it.prod} ${it.gusto}` : nombreProdGusto(e.prod_id, e.gusto_id);
        return `<tr><td>${esc(nom)}</td><td class="num">${esc(e.cantidad)}</td><td class="num">${e.confirmado ? esc(e.cantidad_recibida) : '—'}</td></tr>`;
      }).join('')}</table>` : '';
      const puedeRecibir = env.length && n.estado !== 'recibida' && env.some(e => !e.confirmado);
      return `<div class="mn ${t.cls}">
        <div class="top"><b>${t.label}</b>${etiquetaFecha(n.created_at)}<span class="pill st-${esc(n.estado)}">${ESTADOS[n.estado] || esc(n.estado)}</span>
          ${n.visto_por ? `<span style="font-size:12px;opacity:.8">visto por ${esc(n.visto_por)}</span>` : ''}
          ${n.sigue ? `<span class="sigue-tag" style="background:${colorPersona(n.sigue)}">👤 Lo sigue ${esc(n.sigue)}</span>` : ''}
          ${avancePill(n)}
          ${n.novedad_sucursal ? '<span class="nuevo-tag">Novedad</span>' : ''}
          ${puedeRecibir ? `<button class="btn btn-sm btn-acc" style="margin-left:auto" onclick="abrirRecibir('${esc(n.id)}')">Recibido</button>` : ''}</div>
        ${items}${d.texto ? `<div class="it" style="white-space:pre-wrap">${esc(d.texto)}</div>` : ''}
        ${n.respuesta ? `<div class="resp">💬 ${esc(n.respuesta)}</div>` : ''}${tablaEnv}
      </div>`;
    }).join('');
    window._misNotas = { notas, porNota };
    // Con la ventana minimizada la "Novedad" queda marcada y se avisa en el título (y sonido).
    // Recién cuando el operador vuelve a la ventana se da por vista.
    if (conNovedad.length && ventanaActiva()) {
      ponerTitulo(0);
      sbApi(`pedidos_envio?id=in.(${conNovedad.join(',')})`, { method: 'PATCH', body: JSON.stringify({ novedad_sucursal: false }) })
        .then(avisarCambio).catch(() => {});
    } else {
      ponerTitulo(conNovedad.length, conNovedad.length === 1 ? 'Novedad' : 'Novedades');
      const nuevas = conNovedad.filter(id => !sNovedadVistas.has(String(id)));
      if (nuevas.length) { beep(); nuevas.forEach(id => sNovedadVistas.add(String(id))); }
    }
  }

  function nombreProdGusto(prodId, gustoId) {
    const p = prods.find(x => String(x.id) === String(prodId));
    const g = p?.gustos.find(x => String(x.id) === String(gustoId));
    return `${p ? p.nombre : 'Producto'} ${g ? g.nombre : ''}`;
  }

  function abrirRecibir(notaId) {
    const { notas, porNota } = window._misNotas || {};
    const n = (notas || []).find(x => String(x.id) === String(notaId)); if (!n) return;
    const env = (porNota[n.id] || []);
    abrirModal(`
      <h3>Confirmar lo recibido</h3>
      <div class="sub">Si te llegó otra cantidad, corregila antes de confirmar.</div>
      <table><tr><th>Producto</th><th>Enviado</th><th>Recibido</th></tr>
      ${env.map(e => `<tr><td>${esc(nombreProdGusto(e.prod_id, e.gusto_id))}</td><td class="num">${esc(e.cantidad)}</td>
        <td><input class="inp" type="number" min="0" step="1" data-pid="${esc(e.id)}" value="${e.confirmado ? esc(e.cantidad_recibida) : esc(e.cantidad)}" ${e.confirmado ? 'disabled' : ''}></td></tr>`).join('')}
      </table>
      <div class="acts"><button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn btn-acc" id="btn-conf-rec">Confirmar recibido</button></div>`);
    document.getElementById('btn-conf-rec').onclick = async (ev) => {
      const b = ev.target; b.disabled = true;
      try {
        const ins = [...document.querySelectorAll('#modal-root input[data-pid]:not([disabled])')];
        for (const i of ins) {
          const v = parseInt(i.value);
          if (isNaN(v) || v < 0) { toast('Revisá las cantidades', 'error'); b.disabled = false; return; }
        }
        for (const i of ins) {
          await sbApi(`pedidos?id=eq.${i.dataset.pid}`, { method: 'PATCH', body: JSON.stringify({ confirmado: true, cantidad_recibida: parseInt(i.value), username_op: user.username }) });
        }
        await sbApi(`pedidos_envio?id=eq.${n.id}`, { method: 'PATCH', body: JSON.stringify({ estado: 'recibida', recibida_por: user.username, recibida_at: new Date().toISOString() }) });
        cerrarModal(); toast('📥 Recepción confirmada'); avisarCambio(); cargarMisNotas();
      } catch (e) { toast('Error: ' + e.message, 'error'); b.disabled = false; }
    };
  }

  // ══════════════════════════════════════════════════════════════════
  //  CENTRAL
  // ══════════════════════════════════════════════════════════════════
  async function cargarDatosCentral() {
    const notas = await sbApi(`pedidos_envio?empresa_id=eq.${empresaActual}&archivado=is.false&or=(estado.in.(nueva,vista,en_camino),created_at.gte.${hace7dias()})&order=created_at.asc&select=*`) || [];
    const ids = notas.map(n => n.id);
    const envios = ids.length ? (await sbApi(`pedidos?empresa_id=eq.${empresaActual}&nota_id=in.(${ids.join(',')})&select=*`) || []) : [];
    cEnvios = {}; envios.forEach(e => (cEnvios[e.nota_id] = cEnvios[e.nota_id] || []).push(e));
    cNotas = notas;
    // Aviso de notas nuevas (no en la primera carga)
    const idsSet = new Set(notas.map(n => String(n.id)));
    if (cIdsVistos) {
      const llegaron = notas.filter(n => n.estado === 'nueva' && !cIdsVistos.has(String(n.id)));
      if (llegaron.length) {
        beep();
        const suc = [...new Set(llegaron.map(n => n.pdv_nombre || pdvNombre(n.pdv_id)))].join(', ');
        toast(`📌 ${llegaron.length === 1 ? 'Nota nueva' : llegaron.length + ' notas nuevas'} de ${suc}`);
      }
    }
    cIdsVistos = idsSet;
    const nNuevas = notas.filter(n => n.estado === 'nueva').length;
    ponerTitulo(nNuevas, nNuevas === 1 ? 'nota sin ver' : 'notas sin ver');
    await cargarPersonas();
    const st = await sbApi(`stock?empresa_id=eq.${empresaActual}&select=pdv_id,updated_at`).catch(() => []) || [];
    frescura = {};
    st.forEach(r => { const d = parseTs(r.updated_at); const k = String(r.pdv_id); if (d && (!frescura[k] || d > frescura[k])) frescura[k] = d; });
  }

  async function cargarCentral(silencioso) {
    const app = document.getElementById('app');
    if (!silencioso) app.innerHTML = '<div class="empty">Cargando…</div>';
    try { await cargarDatosCentral(); } catch (e) { app.innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`; return; }
    if (tabActual !== 'central') return;
    renderCentral();
  }

  function notasFiltradas() {
    return cNotas.filter(n =>
      (!cFiltro.tipo || n.tipo === cFiltro.tipo) &&
      (!cFiltro.pdv || String(n.pdv_id) === cFiltro.pdv) &&
      (cFiltro.cerradas || ABIERTOS.includes(n.estado)));
  }

  function renderCentral() {
    const app = document.getElementById('app');
    const scroll = document.getElementById('cboard')?.scrollTop || 0;
    const nNuevas = cNotas.filter(n => n.estado === 'nueva').length;
    app.innerHTML = `
      <div class="c-bar">
        <select class="sel" onchange="cFiltro.tipo=this.value;renderCentral()">
          <option value="">Todos los tipos</option>${['necesito', 'tengo', 'aviso'].map(t => `<option value="${t}" ${cFiltro.tipo === t ? 'selected' : ''}>${TIPOS[t].label}</option>`).join('')}</select>
        <select class="sel" onchange="cFiltro.pdv=this.value;renderCentral()">
          <option value="">Todas las sucursales</option>${pdvs.map(p => `<option value="${esc(p.id)}" ${cFiltro.pdv === String(p.id) ? 'selected' : ''}>${esc(p.nombre || p.name)}</option>`).join('')}</select>
        <label style="font-size:13px;color:var(--text-muted);display:flex;gap:6px;align-items:center"><input type="checkbox" ${cFiltro.cerradas ? 'checked' : ''} onchange="cFiltro.cerradas=this.checked;renderCentral()"> Ver resueltas (7 días)</label>
        <button class="btn btn-sm" onclick="ordenarCentral()" title="Una columna por sucursal, en el orden en que llegaron">Ordenar por sucursal</button>
        ${(() => { const na = cNotas.filter(n => diasAtras(n.created_at) > 0).length; return na ? `<button class="btn btn-sm" onclick="dejarSoloHoy()" title="Saca de la pizarra las notas de días anteriores">Dejar solo las de hoy (${na})</button>` : ''; })()}
        ${(() => { const nc = cNotas.filter(n => !ABIERTOS.includes(n.estado)).length; return nc ? `<button class="btn btn-sm" onclick="sacarCerradas()" title="Saca de la pizarra todas las resueltas y recibidas">Sacar resueltas (${nc})</button>` : ''; })()}
        <span style="font-size:13px;color:var(--text-muted)">${nNuevas ? `<b style="color:var(--accent)">${nNuevas} sin ver</b> · ` : ''}${notasFiltradas().length} notas</span>
        <div class="legend" style="margin-left:auto">
          <span><span class="lg" style="background:var(--nec-bd)"></span>Necesito</span><span><span class="lg" style="background:var(--ten-bd)"></span>Tengo</span><span><span class="lg" style="background:var(--avi-bd)"></span>Aviso</span>
          <span class="pill f-hoy">Hoy</span><span class="pill f-ayer">Ayer</span><span class="pill f-vie">2+ días</span>
        </div>
      </div>
      <div class="fresh-strip">${pdvs.map(p => `<span class="fs">${esc(p.nombre || p.name)} ${frescuraPill(frescura[String(p.id)] ? frescura[String(p.id)].toISOString() : null)}</span>`).join('')}</div>
      <div class="personas-bar">${personas.length
        ? `<span>👤 Arrastrá un nombre a la nota que sigue:</span>${personas.map(p => `<span class="pchip" draggable="true" data-persona="${esc(p.nombre)}" style="border-color:${colorPersona(p.nombre)};box-shadow:inset 4px 0 0 ${colorPersona(p.nombre)}">${esc(p.nombre)}</span>`).join('')}`
        : '<span>👤 Para asignar quién sigue cada nota, cargá las personas en el sistema (Usuarios → Personas de la pizarra).</span>'}</div>
      <div class="cboard" id="cboard"></div>`;
    app.querySelectorAll('.pchip').forEach(ch => {
      ch.addEventListener('dragstart', e => {
        arrastrando = true;
        e.dataTransfer.setData('application/x-persona', ch.dataset.persona);
        e.dataTransfer.setData('text/plain', ch.dataset.persona);
        e.dataTransfer.effectAllowed = 'copy';
      });
      ch.addEventListener('dragend', () => { arrastrando = false; document.querySelectorAll('.pit.drop-on').forEach(x => x.classList.remove('drop-on')); });
    });
    const board = document.getElementById('cboard');
    const lista = notasFiltradas();
    if (!lista.length) { board.innerHTML = '<div class="empty">No hay notas para mostrar.</div>'; return; }
    // Las tarjetas se mueven libres con el mouse (posición guardada para todos).
    // Las que todavía no tienen posición se apilan en la columna de su sucursal,
    // debajo de la última, en el orden en que llegaron, y esa posición se guarda.
    const els = {};
    const poner = (n, x, y) => {
      const el = crearPostit(n);
      el.style.left = x + 'px'; el.style.top = y + 'px';
      board.appendChild(el); els[n.id] = el;
      arrastrable(el, el, board, (nx, ny, movido) => {
        if (movido) { n.pos_x = nx; n.pos_y = ny; sbApi(`pedidos_envio?id=eq.${n.id}`, { method: 'PATCH', body: JSON.stringify({ pos_x: nx, pos_y: ny }) }).catch(() => {}); ajustarAlto(board); }
        else abrirDetalle(n.id);
      }, true);
    };
    lista.filter(n => n.pos_x != null && n.pos_y != null).forEach(n => poner(n, n.pos_x, n.pos_y));
    const nuevas = lista.filter(n => n.pos_x == null || n.pos_y == null)
      .sort((a, b) => (parseTs(a.created_at) || 0) - (parseTs(b.created_at) || 0));
    nuevas.forEach(n => {
      const x = colX(n.pdv_id), y = fondoColumna(board, x);
      n.pos_x = x; n.pos_y = y;
      poner(n, x, y);
      sbApi(`pedidos_envio?id=eq.${n.id}`, { method: 'PATCH', body: JSON.stringify({ pos_x: x, pos_y: y }) }).catch(() => {});
    });
    ajustarAlto(board);
    board.scrollTop = scroll;
  }

  const COL_W = 256, Y0 = 14, GAP = 10;
  // Columna fija de cada sucursal según el orden de los PDV
  function colX(pdvId) {
    const ix = pdvs.findIndex(p => String(p.id) === String(pdvId));
    return 14 + (ix < 0 ? pdvs.length : ix) * COL_W;
  }
  // Primer lugar libre debajo de la última tarjeta que ocupa esa columna
  function fondoColumna(board, x) {
    let y = Y0;
    board.querySelectorAll('.pit').forEach(el => {
      if (Math.abs(el.offsetLeft - x) < COL_W / 2) y = Math.max(y, el.offsetTop + el.offsetHeight + GAP);
    });
    return y;
  }
  function ajustarAlto(board) {
    let maxY = 0;
    board.querySelectorAll('.pit').forEach(el => { maxY = Math.max(maxY, el.offsetTop + el.offsetHeight + 20); });
    board.style.height = Math.max(560, maxY) + 'px';
  }

  // Post-it con todos sus controles (nombres, tildes, visto)
  function crearPostit(n) {
      const el = document.createElement('div');
      el.className = `pit ${(TIPOS[n.tipo] || TIPOS.necesito).cls}${n.estado === 'nueva' ? ' nueva' : ''}`;
      el.innerHTML = htmlPostit(n);
      // Soltar un nombre encima → "Lo sigue"
      el.addEventListener('dragover', e => {
        if (![...e.dataTransfer.types].includes('application/x-persona')) return;
        e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; el.classList.add('drop-on');
      });
      el.addEventListener('dragleave', e => { if (!el.contains(e.relatedTarget)) el.classList.remove('drop-on'); });
      el.addEventListener('drop', e => {
        const nom = e.dataTransfer.getData('application/x-persona');
        el.classList.remove('drop-on');
        if (!nom) return;
        e.preventDefault(); arrastrando = false;
        if (nom !== n.sigue) asignarSigue(n.id, nom);
      });
      const bs = el.querySelector('[data-sacar]');
      if (bs) { bs.addEventListener('pointerdown', e => e.stopPropagation()); bs.onclick = e => { e.stopPropagation(); sacarNotas([n.id]); }; }
      const bq = el.querySelector('[data-quitar-sigue]');
      if (bq) { bq.addEventListener('pointerdown', e => e.stopPropagation()); bq.onclick = e => { e.stopPropagation(); asignarSigue(n.id, null); }; }
      engancharTildes(el);
      const bv = el.querySelector('[data-visto]');
      if (bv) bv.addEventListener('pointerdown', e => e.stopPropagation());
      if (bv) bv.onclick = (e) => { e.stopPropagation(); marcarVisto(n.id); };
      return el;
  }

  function htmlPostit(n) {
    const d = parseDatos(n), t = TIPOS[n.tipo] || TIPOS.necesito;
    const items = d.items || [];
    const lineas = items.slice(0, 7).map((i, ix) => `<div class="it">${tkHtml(n, 'i' + ix, `${esc(nomItem(i))} · ${cantTxt(n.tipo, i)}`)}</div>`).join('')
      + (items.length > 7 ? `<div class="it">+ ${items.length - 7} más… (abrila para tildar)</div>` : '');
    const lt = lineasTexto(d.texto);
    const texto = lt.length ? `<div class="tx">${lt.slice(0, 7).map(x => tkHtml(n, 't' + x.ix, esc(x.l.length > 70 ? x.l.slice(0, 70) + '…' : x.l))).join('')}${lt.length > 7 ? `<div>+ ${lt.length - 7} renglones más…</div>` : ''}</div>` : '';
    const env = cEnvios[n.id] || [];
    return `${n.sigue ? `<div class="sigue" style="background:${colorPersona(n.sigue)}"><span class="nm">👤 ${esc(n.sigue)}</span><button data-quitar-sigue title="Quitar">✕</button></div>` : ''}
      <div class="top"><b>${esc(n.pdv_nombre || pdvNombre(n.pdv_id))}</b><span style="display:flex;gap:5px;align-items:center">${etiquetaFecha(n.created_at)}<button class="sacar" data-sacar title="Sacar de la pizarra">✕</button></span></div>
      <div style="font-size:11px;opacity:.85;margin-bottom:4px">${t.label}${n.usuario ? ' · ' + esc(n.usuario) : ''}</div>
      ${lineas}${texto}${n.respuesta ? `<div class="resp">💬 ${esc(n.respuesta)}</div>` : ''}
      <div class="ft"><span style="display:flex;gap:4px;align-items:center;flex-wrap:wrap"><span class="pill st-${esc(n.estado)}">${ESTADOS[n.estado] || esc(n.estado)}${env.length ? ' · ' + env.length + ' env.' : ''}</span>${avancePill(n)}</span>
        ${n.estado === 'nueva' ? '<button data-visto>Visto</button>' : '<span style="font-size:11px;opacity:.7">clic para abrir</span>'}</div>`;
  }

  async function marcarVisto(id) {
    try {
      await sbApi(`pedidos_envio?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ estado: 'vista', visto_por: user.username, visto_at: new Date().toISOString(), novedad_sucursal: true }) });
      const n = cNotas.find(x => String(x.id) === String(id)); if (n) { n.estado = 'vista'; n.visto_por = user.username; }
      avisarCambio(); renderCentral();
    } catch (e) { toast('Error: ' + e.message, 'error'); }
  }

  // ── SACAR NOTAS DE LA PIZARRA (archivar) ──
  // Solo las saca de la central: no cambia el estado y la sucursal las sigue viendo en "Mis notas".
  async function setArchivado(ids, valor) {
    await sbApi(`pedidos_envio?id=in.(${ids.join(',')})`, { method: 'PATCH', body: JSON.stringify({ archivado: valor }) });
  }
  async function sacarNotas(ids) {
    if (!ids.length) return;
    const sacadas = cNotas.filter(n => ids.map(String).includes(String(n.id)));
    cNotas = cNotas.filter(n => !ids.map(String).includes(String(n.id)));
    if (modalAbierto) cerrarModal(); else renderCentral();
    try {
      await setArchivado(ids, true);
      avisarCambio();
      const txt = ids.length === 1 ? `Nota de ${sacadas[0]?.pdv_nombre || pdvNombre(sacadas[0]?.pdv_id)} sacada` : `${ids.length} notas sacadas`;
      toast(txt, 'success', { label: 'Deshacer', fn: async () => {
        try { await setArchivado(ids, false); avisarCambio(); await cargarCentral(true); }
        catch (e) { toast('Error: ' + e.message, 'error'); }
      } });
    } catch (e) {
      cNotas = cNotas.concat(sacadas); renderCentral();
      toast('No se pudo sacar: ' + e.message, 'error');
    }
  }
  function sacarCerradas() {
    const ids = cNotas.filter(n => !ABIERTOS.includes(n.estado)).map(n => n.id);
    if (!ids.length) return;
    if (!confirm(`Se sacan de la pizarra ${ids.length} notas resueltas o recibidas. ¿Seguir?`)) return;
    sacarNotas(ids);
  }

  // Limpieza: deja en la central solo las notas de hoy.
  // Las de días anteriores que siguen abiertas (ej. el pedido de anoche sin mandar) se eligen aparte.
  function dejarSoloHoy() {
    const viejas = cNotas.filter(n => diasAtras(n.created_at) > 0);
    if (!viejas.length) { toast('Ya quedan solo las de hoy'); return; }
    const cerradas = viejas.filter(n => !ABIERTOS.includes(n.estado));
    const abiertas = viejas.filter(n => ABIERTOS.includes(n.estado));
    const porSuc = abiertas.reduce((m, n) => { const k = n.pdv_nombre || pdvNombre(n.pdv_id); m[k] = (m[k] || 0) + 1; return m; }, {});
    window._limpiar = { todas: viejas.map(n => n.id), cerradas: cerradas.map(n => n.id) };
    abrirModal(`
      <h3>Dejar solo las notas de hoy</h3>
      <div class="sub">Se sacan de la pizarra central. No se borra nada: la sucursal las sigue viendo y el envío queda registrado.</div>
      <div style="font-size:13px;line-height:1.8">
        <div>De días anteriores: <b>${viejas.length}</b></div>
        <div>· resueltas o recibidas: <b>${cerradas.length}</b></div>
        <div>· todavía abiertas: <b style="color:${abiertas.length ? 'var(--nec-tx)' : 'inherit'}">${abiertas.length}</b>${abiertas.length ? ` <span style="color:var(--text-muted)">(${Object.entries(porSuc).map(([s, c]) => `${esc(s)} ${c}`).join(' · ')})</span>` : ''}</div>
      </div>
      <div class="acts">
        <button class="btn" onclick="cerrarModal()">Cancelar</button>
        ${abiertas.length && cerradas.length ? `<button class="btn" onclick="sacarNotas(window._limpiar.cerradas)">Sacar ${cerradas.length} (dejar las abiertas)</button>` : ''}
        <button class="btn btn-acc" onclick="sacarNotas(window._limpiar.todas)">Sacar ${abiertas.length ? 'todas (' + viejas.length + ')' : viejas.length}</button>
      </div>`);
  }

  function ordenarCentral() {
    const lista = notasFiltradas(); if (!lista.length) return;
    if (!confirm('Se van a acomodar las tarjetas en una columna por sucursal, en el orden en que llegaron. ¿Seguir?')) return;
    // Sin posición → renderCentral las apila por sucursal y guarda la nueva ubicación
    lista.forEach(n => { n.pos_x = null; n.pos_y = null; });
    renderCentral();
    toast('Pizarra ordenada por sucursal');
  }

  function abrirDetalle(id) {
    const n = cNotas.find(x => String(x.id) === String(id)); if (!n) return;
    const d = parseDatos(n), t = TIPOS[n.tipo] || TIPOS.necesito;
    const items = d.items || [];
    const env = cEnvios[n.id] || [];
    const abierta = ABIERTOS.includes(n.estado);
    const puedeEnviar = n.tipo === 'necesito' && items.length && !env.length && abierta;
    const conRef = items.some(i => i.vendio != null || i.tiene != null);
    // ref_txt (nuevo: "prom. 4 vie") o ref_fecha (notas viejas: un solo día)
    const itRef = items.find(i => i.ref_txt || i.ref_fecha);
    const refLbl = itRef ? (itRef.ref_txt || fechaCorta(itRef.ref_fecha)) : '';
    const refTit = itRef?.ref_fechas?.length ? 'Promedio de ' + itRef.ref_fechas.map(fechaCorta).join(', ') : (itRef?.ref_fecha ? 'Vendido el ' + fechaCorta(itRef.ref_fecha) : '');
    const colCant = n.tipo === 'tengo' ? 'Sobra' : n.tipo === 'necesito' ? 'Pide' : 'Cant.';
    const informa = Array.isArray(d.informa) ? d.informa : [];
    const tabla = items.length ? `<table><tr><th title="Tildar al armar">✓</th><th>Producto</th>${conRef ? `<th>Tiene</th><th title="${esc(refTit)}">Vendió${refLbl ? ' <span style="font-weight:400">(' + esc(refLbl) + ')</span>' : ''}</th>` : ''}<th>${colCant}</th>${puedeEnviar ? '<th>Envío</th><th></th>' : ''}${env.length ? '<th>Enviado</th><th>Recibido</th>' : ''}</tr>
      ${items.map((i, ix) => {
        const e = env.find(x => String(x.prod_id) === String(i.prod_id) && String(x.gusto_id) === String(i.gusto_id));
        const tOn = tildesDe(n).includes('i' + ix);
        return `<tr class="tkrow${tOn ? ' hecho' : ''}"><td style="width:22px"><input type="checkbox" data-tk="${esc(n.id)}|i${ix}" ${tOn ? 'checked' : ''}></td><td><span>${esc(nomItem(i))}</span></td>${conRef ? `<td class="num">${i.tiene != null ? esc(i.tiene) + (i.unidad ? ' ' + esc(i.unidad) : '') : '—'}</td><td class="num">${i.vendio != null ? esc(i.vendio) : '—'}</td>` : ''}<td class="num">${esc(i.cant)}${i.unidad ? ' ' + esc(i.unidad) : ''}${i.sugerido != null && String(i.sugerido) !== String(i.cant) ? ` <span style="font-size:11px;color:var(--text-muted)" title="Sugerido del sistema">(sug. ${esc(i.sugerido)})</span>` : ''}</td>
          ${puedeEnviar ? `<td><input class="inp" type="number" min="0" step="1" data-ix="${ix}" value="${conRef ? (parseInt(i.cant) || '') : ''}" placeholder="—" oninput="difEnvio(this,${parseInt(i.cant) || 0})"></td><td class="dcell"></td>` : ''}
          ${env.length ? `<td class="num">${e ? esc(e.cantidad) : '—'}</td><td class="num">${e && e.confirmado ? esc(e.cantidad_recibida) + (parseInt(e.cantidad_recibida) !== parseInt(e.cantidad) ? ` <span class="dif">(${parseInt(e.cantidad_recibida) - parseInt(e.cantidad)})</span>` : '') : '—'}</td>` : ''}</tr>`;
      }).join('')}</table>` : '';
    const linea = (lbl, quien, cuando) => quien ? `<div>${lbl}: <b>${esc(quien)}</b>${cuando ? ' · ' + esc(parseTs(cuando)?.toLocaleString('es-AR', { timeZone: 'America/Argentina/Buenos_Aires', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }) || '') : ''}</div>` : '';
    abrirModal(`
      <h3>${esc(n.pdv_nombre || pdvNombre(n.pdv_id))} · ${t.label}</h3>
      <div class="sub">${etiquetaFecha(n.created_at)} <span class="pill st-${esc(n.estado)}">${ESTADOS[n.estado] || esc(n.estado)}</span> ${n.usuario ? '· enviada por ' + esc(n.usuario) : ''}</div>
      ${tabla}
      ${informa.length ? `<div style="font-size:12px;color:var(--text-muted);margin:4px 0 8px">También informó stock (sin pedir): ${informa.map(x => `${esc(x.prod)}${x.gusto ? ' ' + esc(x.gusto) : ''} <b style="color:var(--text)">${esc(x.tiene)}</b>${x.unidad ? ' ' + esc(x.unidad) : ''}`).join(' · ')}</div>` : ''}
      ${d.texto ? `<div style="font-size:13px;background:var(--surface2);border-radius:8px;padding:8px 10px;margin:8px 0;line-height:1.7">${lineasTexto(d.texto).map(x => tkHtml(n, 't' + x.ix, esc(x.l))).join('')}</div>` : ''}
      <div style="display:flex;align-items:center;gap:8px;margin:10px 0 4px;font-size:13px">👤 Lo sigue:
        <select class="sel" id="m-sigue"><option value="">— nadie —</option>${[...new Set([...(n.sigue ? [n.sigue] : []), ...personas.map(p => p.nombre)])].map(nm => `<option value="${esc(nm)}" ${nm === n.sigue ? 'selected' : ''}>${esc(nm)}</option>`).join('')}</select>
        ${(() => { const a = avanceDe(n); return a.total ? `<span class="avance${a.hechos === a.total && a.hechos ? ' full' : ''}" id="m-avance" style="margin-left:auto">✓ ${a.hechos}/${a.total} armado</span>` : ''; })()}
      </div>
      ${puedeEnviar ? (conRef
        ? '<div style="font-size:12px;color:var(--text-muted)">Envío viene cargado con lo que pidió la sucursal: cambialo si querés. El envío se registra recién al poner <b>En camino</b> o <b>Resuelta</b> (dejá vacío lo que no mandás) y la sucursal confirma lo recibido. "Guardar respuesta" no registra envío.</div>'
        : '<div style="font-size:12px;color:var(--text-muted)">La columna Envío es opcional. Si la completás, se registra al poner <b>En camino</b> o <b>Resuelta</b> y la sucursal confirma lo recibido.</div>') : ''}
      <div style="font-size:12px;color:var(--text-muted);margin-top:8px;line-height:1.6">
        ${linea('Vista por', n.visto_por, n.visto_at)}${linea('Respondida por', n.respondido_por, n.respondido_at)}${linea('Resuelta por', n.resuelta_por, n.resuelta_at)}${linea('Recibida por', n.recibida_por, n.recibida_at)}
      </div>
      <textarea id="m-resp" placeholder="Respuesta para la sucursal (opcional)">${esc(n.respuesta || '')}</textarea>
      <div class="acts">
        <button class="btn" style="margin-right:auto" onclick="sacarNotas(['${esc(n.id)}'])" title="La saca de la pizarra central (la sucursal la sigue viendo)">Sacar de la pizarra</button>
        <button class="btn" onclick="cerrarModal()">Cerrar</button>
        ${abierta ? `<button class="btn" onclick="accionNota('${esc(n.id)}','responder',this)">Guardar respuesta</button>` : ''}
        ${abierta && n.tipo === 'necesito' && n.estado !== 'en_camino' ? `<button class="btn" onclick="accionNota('${esc(n.id)}','en_camino',this)">En camino</button>` : ''}
        ${abierta ? `<button class="btn btn-acc" onclick="accionNota('${esc(n.id)}','resuelta',this)">Resuelta</button>` : ''}
      </div>`);
    const root = document.getElementById('modal-root');
    engancharTildes(root);
    document.getElementById('m-sigue').onchange = (e) => asignarSigue(n.id, e.target.value || null);
  }

  function difEnvio(inp, pidio) {
    const cell = inp.closest('tr').querySelector('.dcell');
    if (inp.value === '') { cell.innerHTML = ''; return; }
    const v = parseInt(inp.value) || 0;
    cell.innerHTML = v === pidio ? '<span class="ok">completo</span>' : `<span class="dif">${v - pidio > 0 ? '+' : ''}${v - pidio}</span>`;
  }

  async function accionNota(id, accion, btn) {
    const n = cNotas.find(x => String(x.id) === String(id)); if (!n) return;
    const d = parseDatos(n), items = d.items || [];
    const resp = document.getElementById('m-resp').value.trim();
    const ahora = new Date().toISOString();
    const patch = { novedad_sucursal: true };
    if (resp !== (n.respuesta || '')) Object.assign(patch, { respuesta: resp || null, respondido_por: user.username, respondido_at: ahora });
    if (n.estado === 'nueva') Object.assign(patch, { estado: 'vista', visto_por: user.username, visto_at: ahora });
    if (accion === 'en_camino') patch.estado = 'en_camino';
    if (accion === 'resuelta') Object.assign(patch, { estado: 'resuelta', resuelta_por: user.username, resuelta_at: ahora });
    // Envío (opcional) → tabla pedidos, igual que "Pedido por sucursal"
    // "Guardar respuesta" NO registra envíos: solo En camino o Resuelta
    const envios = [];
    let invalido = false;
    if (accion !== 'responder') document.querySelectorAll('#modal-root input[data-ix]').forEach(i => {
      if (i.value === '') return;
      const v = parseInt(i.value);
      if (isNaN(v) || v < 0) { invalido = true; return; }
      if (v === 0) return;
      const it = items[parseInt(i.dataset.ix)];
      if (!it || !it.prod_id || !it.gusto_id) return;
      envios.push({ empresa_id: String(empresaActual), pdv_id: String(n.pdv_id), prod_id: String(it.prod_id), gusto_id: String(it.gusto_id),
        cantidad: v, fecha_pedido: n.fecha || fechaHoyAR(), fecha_envio: fechaHoyAR(), estado: 'enviado', username_admin: user.username, nota_id: String(n.id) });
    });
    if (invalido) { toast('Revisá las cantidades de envío', 'error'); return; }
    btn.disabled = true;
    try {
      if (envios.length) await sbApi('pedidos', { method: 'POST', body: JSON.stringify(envios) });
      await sbApi(`pedidos_envio?id=eq.${n.id}`, { method: 'PATCH', body: JSON.stringify(patch) });
      cerrarModal();
      toast(accion === 'resuelta' ? '✅ Nota resuelta' : accion === 'en_camino' || envios.length ? '🚚 Marcada en camino' : '💬 Respuesta guardada');
      avisarCambio();
      await cargarCentral(true);
    } catch (e) { toast('Error: ' + e.message, 'error'); btn.disabled = false; }
  }

  // ══════════════════════════════════════════════════════════════════
  //  RESUMEN Y CRUCE
  // ══════════════════════════════════════════════════════════════════
  async function cargarResumen() {
    const app = document.getElementById('app');
    if (!document.getElementById('resumen-wrap')) app.innerHTML = '<div class="empty">Cargando…</div>';
    try { await cargarDatosCentral(); } catch (e) { app.innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`; return; }
    if (tabActual !== 'resumen') return;
    const pend = cNotas.filter(n => n.estado === 'nueva' || n.estado === 'vista');
    const agg = (tipo) => {
      const m = {};
      pend.filter(n => n.tipo === tipo).forEach(n => (parseDatos(n).items || []).forEach(i => {
        const k = `${i.prod_id || i.prod}_${i.gusto_id || i.gusto}`;
        if (!m[k]) m[k] = { prod: i.prod, gusto: i.gusto, unidad: i.unidad || '', total: 0, por: {} };
        const c = parseInt(i.cant) || 0;
        m[k].total += c;
        const pn = n.pdv_nombre || pdvNombre(n.pdv_id);
        m[k].por[pn] = (m[k].por[pn] || 0) + c;
      }));
      return m;
    };
    const nec = agg('necesito'), ten = agg('tengo');
    const filasNec = Object.values(nec).sort((a, b) => (a.prod + a.gusto).localeCompare(b.prod + b.gusto));
    const cruces = [];
    Object.entries(nec).forEach(([k, v]) => {
      if (!ten[k]) return;
      Object.entries(v.por).forEach(([pN, cN]) => Object.entries(ten[k].por).forEach(([pT, cT]) => {
        if (pN !== pT) cruces.push({ prod: v.prod, gusto: v.gusto, pN, cN, pT, cT });
      }));
    });
    const hoy = Date.now();
    app.innerHTML = `<div id="resumen-wrap" class="grid2">
      <div class="panel"><h3>Lo que piden las sucursales <span style="font-size:12px;color:var(--text-muted);font-weight:400">· notas nuevas o vistas</span></h3>
        ${filasNec.length ? `<table class="tbl"><tr><th>Producto</th><th>Total</th><th>Detalle</th></tr>
          ${filasNec.map(f => `<tr><td>${esc(f.prod)} ${esc(f.gusto)}</td><td class="num"><b>${f.total}</b>${f.unidad ? ' ' + esc(f.unidad) : ''}</td><td style="font-size:12px;color:var(--text-muted)">${Object.entries(f.por).map(([p, c]) => `${esc(p)} ${c}`).join(' · ')}</td></tr>`).join('')}
        </table>` : '<div class="empty" style="padding:16px">No hay pedidos pendientes.</div>'}
      </div>
      <div class="panel"><h3>Cruce: necesita ↔ tiene</h3>
        ${cruces.length ? `<table class="tbl"><tr><th>Producto</th><th>Necesita</th><th>Tiene</th></tr>
          ${cruces.map(c => `<tr><td>${esc(c.prod)} ${esc(c.gusto)}</td><td><span style="color:var(--nec-tx)">${esc(c.pN)}</span> <span class="num">${c.cN}</span></td><td><span style="color:var(--ten-tx)">${esc(c.pT)}</span> <span class="num">${c.cT}</span></td></tr>`).join('')}
        </table>` : '<div class="empty" style="padding:16px">No hay coincidencias entre lo que una sucursal necesita y otra tiene.</div>'}
      </div>
      <div class="panel"><h3>Stock por sucursal</h3>
        <table class="tbl"><tr><th>Sucursal</th><th>Última carga</th></tr>
          ${[...pdvs].sort((a, b) => (frescura[String(a.id)]?.getTime() || 0) - (frescura[String(b.id)]?.getTime() || 0)).map(p => {
            const f = frescura[String(p.id)];
            return `<tr><td>${esc(p.nombre || p.name)}</td><td>${frescuraPill(f ? f.toISOString() : null)}</td></tr>`;
          }).join('')}
        </table>
      </div>
    </div>`;
  }

  // ══════════════════════════════════════════════════════════════════
  //  CONFIGURACIÓN (admin)
  // ══════════════════════════════════════════════════════════════════
  function renderConfig() {
    const nEleg = prods.filter(p => p.en_pizarra).length;
    document.getElementById('app').innerHTML = `<div class="grid2" style="align-items:start"><div class="panel">
      <h3>Puntos de venta que ven todas las pizarras</h3>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">Cualquier operador que trabaje en un punto de venta tildado ve la pizarra central, puede marcar visto, responder, registrar envíos y resolver.</div>
      <table class="tbl">${pdvs.map(p => `<tr><td>${esc(p.nombre || p.name)}</td>
        <td style="text-align:right"><label style="display:inline-flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" ${p.pizarra_ve_todas ? 'checked' : ''} onchange="setVeTodas('${esc(p.id)}',this)"> Ve todas</label></td></tr>`).join('')}
      </table></div>
      <div class="panel">
        <h3>Productos de la pizarra <span id="cfg-nprod" style="font-size:12px;color:var(--text-muted);font-weight:400">· ${nEleg} elegidos</span></h3>
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">Los tildados son las tarjetas que ven todas las sucursales en su mazo. Si no tildás ninguno, cada sucursal ve los productos que tiene asignados. Los productos sin gustos se cargan con una sola cantidad.</div>
        <table class="tbl">${prods.map(p => `<tr><td>${esc(p.nombre)}<span style="font-size:11px;color:var(--text-muted)"> · ${p.gustos.length ? p.gustos.length + ' gustos' : 'sin gustos'}</span></td>
          <td style="text-align:right"><label style="display:inline-flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" ${p.en_pizarra ? 'checked' : ''} onchange="setEnPizarra('${esc(p.id)}',this)"> En la pizarra</label></td></tr>`).join('') || '<tr><td class="empty">No hay productos cargados</td></tr>'}
        </table>
      </div></div>`;
  }
  async function setEnPizarra(id, chk) {
    try {
      await sbApi(`productos?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ en_pizarra: chk.checked }) });
      const p = prods.find(x => String(x.id) === String(id)); if (p) p.en_pizarra = chk.checked;
      const c = document.getElementById('cfg-nprod'); if (c) c.textContent = `· ${prods.filter(x => x.en_pizarra).length} elegidos`;
      toast('Guardado');
    } catch (e) { chk.checked = !chk.checked; toast('Error: ' + e.message, 'error'); }
  }
  async function setVeTodas(id, chk) {
    try {
      await sbApi(`pdvs?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ pizarra_ve_todas: chk.checked }) });
      const p = pdvs.find(x => String(x.id) === String(id)); if (p) p.pizarra_ve_todas = chk.checked;
      toast('Guardado');
    } catch (e) { chk.checked = !chk.checked; toast('Error: ' + e.message, 'error'); }
  }

  // ══════════════════════════════════════════════════════════════════
  //  ARRASTRE / MODAL
  // ══════════════════════════════════════════════════════════════════
  function arrastrable(el, handle, board, onEnd, clicEsAccion) {
    handle.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      if (e.target.closest('button,select,input,textarea')) return;
      e.preventDefault();
      handle.setPointerCapture(e.pointerId);
      el.style.zIndex = ++sZ;
      const sx = e.clientX, sy = e.clientY, ox = el.offsetLeft, oy = el.offsetTop;
      let movido = false;
      arrastrando = true;
      const mv = ev => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (!movido && Math.abs(dx) + Math.abs(dy) < 5) return;
        movido = true;
        el.style.left = Math.max(0, Math.min(board.scrollWidth - el.offsetWidth, ox + dx)) + 'px';
        el.style.top = Math.max(0, oy + dy) + 'px';
      };
      const up = () => {
        handle.removeEventListener('pointermove', mv);
        handle.removeEventListener('pointerup', up);
        handle.removeEventListener('pointercancel', up);
        arrastrando = false;
        if (onEnd) onEnd(Math.round(el.offsetLeft), Math.round(el.offsetTop), movido);
      };
      handle.addEventListener('pointermove', mv);
      handle.addEventListener('pointerup', up);
      handle.addEventListener('pointercancel', up);
    });
  }

  function abrirModal(html) {
    modalAbierto = true;
    document.getElementById('modal-root').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)cerrarModal()"><div class="modal">${html}</div></div>`;
  }
  function cerrarModal() {
    modalAbierto = false; document.getElementById('modal-root').innerHTML = '';
    if (tabActual === 'central' && document.getElementById('cboard')) renderCentral();  // refleja tildes y "lo sigue" cambiados en el detalle
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalAbierto) cerrarModal(); });

  init();
</script>
