<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Promo · Miguel Ángel Pastas</title>
<meta name="theme-color" content="#9e1b22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --rojo:#9e1b22; --rojo2:#7a1218; --rojo3:#c42a31;
  --verde:#1f4d36; --verde2:#2d6a4c;
  --crema:#fbf4e6; --crema2:#f1e4c8;
  --oro:#d6a640; --oro2:#f3d48a;
  --tinta:#2b1d14;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#2a0c0e}
body{font-family:Inter,system-ui,sans-serif;color:var(--tinta);min-height:100vh}

/* ===== Tema Black Friday ===== */
html:has(body.tema-blackfriday),body.tema-blackfriday{background:#000}
body.tema-blackfriday .page{background:
    radial-gradient(circle at 20% 10%,rgba(243,212,138,.08) 0 1.5px,transparent 2.5px) 0 0/38px 38px,
    linear-gradient(180deg,#1b1b1b 0%,#0c0c0c 55%,#000 100%)}
body.tema-blackfriday .guirnalda{display:none}
body.tema-blackfriday .titulo{text-transform:uppercase;letter-spacing:.02em}
body.tema-blackfriday .estado{background:rgba(255,255,255,.05)}
body.tema-blackfriday .door .front{background:#1d1d1d;border-color:rgba(214,166,64,.35)}
body.tema-blackfriday .door .front .n{color:var(--oro2)}
body.tema-blackfriday .door.c2 .front{background:#111}
body.tema-blackfriday .door.c3 .front{background:#2a2a2a}
body.tema-blackfriday .door.today .front{background:linear-gradient(145deg,var(--oro2),var(--oro))}
body.tema-blackfriday .door.today .front .n{color:#111}
body.tema-blackfriday .door.today .front .lk{color:#111}
body.tema-blackfriday .inside .tx{color:#111}
body.tema-blackfriday .paso .num{background:#111;color:var(--oro2)}
body.tema-blackfriday .como h3{color:#111}
body.tema-blackfriday .prog .top b{color:#111}
body.tema-blackfriday .cta{background:var(--oro);color:#111;box-shadow:0 4px 0 #8a6a22}
body.tema-blackfriday .btn.verde{background:#111;color:var(--oro2);box-shadow:0 4px 0 #000}
body.tema-blackfriday .btn.rojo{background:#111;color:var(--oro2);box-shadow:0 4px 0 #000}
body.tema-blackfriday .sheet h2{color:#111}
body.tema-blackfriday .sheet .dia{color:#8a6a22}
body.tema-blackfriday .chips button.sel{background:#111;border-color:#111;color:var(--oro2)}
body.tema-blackfriday .story{background:
    radial-gradient(circle at 20% 10%,rgba(243,212,138,.1) 0 1.5px,transparent 2.5px) 0 0/34px 34px,
    linear-gradient(180deg,#222 0%,#0e0e0e 50%,#000 100%)}
body.tema-blackfriday .story .titulo{text-transform:uppercase}
body.tema-blackfriday .mini div{background:#1d1d1d;color:var(--oro2)}
body.tema-blackfriday .mini div.hl{background:var(--oro);color:#111}

/* Barra de vista previa (solo con ?ver=) */
.previa{position:sticky;top:0;z-index:50;background:#111;color:#ddd;font-size:12px;display:none;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:8px 10px}
.previa b{color:var(--oro2)}
.previa select{font:inherit;background:#222;color:#fff;border:1px solid #444;border-radius:6px;padding:4px 8px}

/* ===== Página ===== */
.page{max-width:440px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 20% 10%,rgba(255,255,255,.07) 0 2px,transparent 3px) 0 0/38px 38px,
    radial-gradient(circle at 70% 60%,rgba(255,255,255,.05) 0 1.5px,transparent 2.5px) 0 0/52px 52px,
    linear-gradient(180deg,var(--rojo) 0%,var(--rojo2) 60%,#5c0d12 100%);
  padding-bottom:40px}
.head{text-align:center;color:var(--crema);padding:22px 20px 8px;position:relative}
.logo{display:block;width:150px;height:150px;border-radius:50%;margin:0 auto 10px;background:#fff;
  box-shadow:0 0 0 3px var(--oro),0 6px 18px rgba(0,0,0,.35)}
.titulo{font-family:"Playfair Display",serif;font-weight:800;font-size:38px;line-height:1.02;margin:10px 0 6px}
.titulo i{font-weight:600;color:var(--oro2)}
.bajada{font-size:14px;opacity:.9;line-height:1.45;max-width:320px;margin:0 auto}
.guirnalda{display:flex;justify-content:center;gap:14px;margin:14px 0 4px}
.guirnalda span{width:9px;height:9px;border-radius:50%;background:var(--oro2);box-shadow:0 0 8px var(--oro2);animation:tw 2.4s infinite}
.guirnalda span:nth-child(2n){background:#7fd1a3;box-shadow:0 0 8px #7fd1a3;animation-delay:.6s}
.guirnalda span:nth-child(3n){animation-delay:1.2s}
body.tema-generico .guirnalda{display:none}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}

.estado{margin:14px 16px 0;background:rgba(0,0,0,.22);border:1px solid rgba(214,166,64,.45);border-radius:14px;color:var(--crema);
  padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center}
.estado .ic{font-size:22px}
.estado b{color:var(--oro2)}

.prog{margin:10px 16px 0;background:var(--crema);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.4}
.prog .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px}
.prog .top b{font-family:"Playfair Display",serif;font-size:18px;color:var(--rojo)}
.prog .top span{font-size:11px;font-weight:700;color:var(--verde2);text-transform:uppercase;letter-spacing:.06em;text-align:right}
.seg{display:grid;gap:2px}
.seg i{height:8px;border-radius:2px;background:#e8dcc2}
.seg i.ok{background:var(--verde2)}
.seg i.miss{background:#d9a3a3}
.seg i.hoy{background:var(--oro);animation:tw 1.4s infinite}
.prog p{margin-top:8px;color:#5a4334}
.prog p.mal{color:var(--rojo3)}

/* Pocas puertas (1 a 3): una sola fila, más grandes */
.grid.pocas{grid-auto-rows:150px}
.grid.pocas .front .n{font-size:64px}
.grid.pocas .inside .em{font-size:48px}.grid.pocas .inside .tx{font-size:12px}

/* ===== Grilla de puertas ===== */
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:84px;grid-auto-flow:dense;gap:8px;padding:16px}
.door{position:relative;perspective:700px;cursor:default;border-radius:10px}
.door.big{grid-column:span 2;grid-row:span 2}
.door.wide{grid-column:span 2}
.inside,.front{position:absolute;inset:0;border-radius:10px}
.inside{background:var(--crema);display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.25);text-align:center;padding:4px}
.inside .em{font-size:28px;line-height:1}
.inside .tx{font-size:9.5px;font-weight:700;color:var(--rojo2);margin-top:4px;line-height:1.1;text-transform:uppercase}
.big .inside .em{font-size:56px}.big .inside .tx{font-size:12px}
.front{transform-origin:left center;transition:transform .9s cubic-bezier(.3,.7,.3,1);backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:var(--crema2);border:1.5px solid rgba(122,18,24,.18);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.front .n{font-family:"Playfair Display",serif;font-weight:800;font-size:30px;color:var(--rojo)}
.big .front .n{font-size:72px}
.wide .front .n{font-size:34px}
.front .lk{position:absolute;bottom:5px;right:7px;font-size:10px;opacity:.45}
.front::after{content:"";position:absolute;right:7px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--oro);box-shadow:0 0 0 1.5px rgba(0,0,0,.15)}
.gs{position:absolute;bottom:14px;left:0;right:0;text-align:center;font:800 11px Inter,sans-serif;letter-spacing:.14em;color:var(--oro2)}
.door.c1 .front{background:var(--verde);border-color:rgba(255,255,255,.12)} .door.c1 .front .n{color:var(--crema)}
.door.c2 .front{background:var(--crema)}
.door.c3 .front{background:var(--rojo3);border-color:rgba(255,255,255,.15)} .door.c3 .front .n{color:var(--crema)}
.door.c4 .front{background:var(--verde2);border-color:rgba(255,255,255,.12)} .door.c4 .front .n{color:var(--oro2)}
body.tema-generico .door.c1 .front,body.tema-generico .door.c4 .front{background:#5c0d12}
.door.future .front{filter:saturate(.75)}
.door.past .front{transform:rotateY(-105deg)}
.door.past .inside{opacity:.55}
.door.past .inside::after{content:"VENCIDA";position:absolute;bottom:4px;font-size:8px;letter-spacing:.1em;color:#8a6b55;font-weight:700}
.door.past.claimed .inside{opacity:1}
.door.past.claimed .inside::after{content:"✔ ABIERTA";color:var(--verde2)}
.door.today{cursor:pointer;z-index:2}
.door.today .front{background:linear-gradient(145deg,var(--oro2),var(--oro));border:2px solid #fff3cf;animation:pulse 1.6s infinite}
.door.today .front .n{color:var(--rojo2)}
.door.today .front .lk{opacity:1;font-weight:800;color:var(--rojo2);font-size:9px;letter-spacing:.08em;bottom:auto;top:5px;left:0;right:0;text-align:center}
.door.today.opening .front,.door.today.open .front{transform:rotateY(-105deg);animation:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(243,212,138,.8),0 3px 0 rgba(0,0,0,.2)}50%{box-shadow:0 0 0 8px rgba(243,212,138,0),0 3px 0 rgba(0,0,0,.2)}}

.como{margin:6px 16px 0;background:var(--crema);border-radius:16px;padding:16px 16px 6px}
.como h3{font-family:"Playfair Display",serif;font-size:20px;color:var(--rojo);margin-bottom:10px}
.paso{display:flex;gap:12px;margin-bottom:12px;font-size:13.5px;line-height:1.4}
.paso .num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--rojo);color:var(--crema);display:grid;place-items:center;font-weight:800;font-size:13px}
.cta{display:block;margin:16px;padding:15px;border-radius:14px;text-align:center;text-decoration:none;font-weight:800;font-size:15px;
  background:var(--verde);color:var(--crema);box-shadow:0 4px 0 #0f2d1f}
.legal{color:rgba(251,244,230,.6);font-size:10.5px;text-align:center;padding:0 24px;line-height:1.5}
.quien{color:rgba(251,244,230,.75);font-size:12px;text-align:center;margin-top:12px}
.quien button{background:none;border:0;color:var(--oro2);font:700 12px Inter,sans-serif;text-decoration:underline;cursor:pointer}
.vacio{color:var(--crema);text-align:center;padding:30px 24px;font-size:15px;line-height:1.5}
.vacio .ic{font-size:48px;margin-bottom:10px}

/* ===== Hoja (modal) ===== */
.ov{position:fixed;inset:0;background:rgba(20,5,6,.72);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:60}
.ov.show{display:flex}
.sheet{width:100%;max-width:440px;max-height:92vh;overflow:auto;background:var(--crema);border-radius:22px 22px 0 0;padding:22px 20px 28px;position:relative;animation:up .35s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.x{position:absolute;right:14px;top:12px;background:none;border:0;font-size:22px;color:#8a6b55;cursor:pointer}
.sheet .dia{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--rojo3);font-weight:700}
.sheet h2{font-family:"Playfair Display",serif;font-size:26px;color:var(--rojo2);margin:4px 0 8px;line-height:1.1}
.sheet p{font-size:14px;line-height:1.45;color:#5a4334}
.inp{margin-top:14px}
.inp label{font-size:12px;font-weight:700;color:#5a4334}
.inp input{width:100%;margin-top:6px;padding:14px;border-radius:12px;border:2px solid var(--crema2);background:#fff;font:600 17px Inter,sans-serif;outline:none}
.inp input:focus{border-color:var(--oro)}
.err{color:var(--rojo3);font-size:12px;margin-top:8px;min-height:15px}
.btn{width:100%;border:0;border-radius:14px;padding:15px;margin-top:10px;font:800 15px Inter,sans-serif;cursor:pointer}
.btn:disabled{opacity:.6}
.btn.rojo{background:var(--rojo);color:var(--crema);box-shadow:0 4px 0 var(--rojo2)}
.btn.verde{background:var(--verde);color:var(--crema);box-shadow:0 4px 0 #0f2d1f}
.btn.borde{background:transparent;border:2px solid var(--crema2);color:var(--rojo2)}
.premio{text-align:center}
.premio .em{font-size:72px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}to{transform:none}}
.code{margin:14px auto 4px;display:inline-block;border:2px dashed var(--oro);background:#fff8e6;border-radius:12px;padding:10px 18px;
  font:800 20px ui-monospace,Menlo,monospace;letter-spacing:.08em;color:var(--rojo2)}
.vence{font-size:12px;color:#8a6b55}
.hola{font-size:13px;color:var(--verde2);font-weight:700;margin-bottom:2px}
.donde{margin:14px 0 4px;display:grid;gap:8px;text-align:left}
.donde>div{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.35;color:#5a4334}
.donde b{color:var(--tinta)}
.donde .i{font-size:20px;line-height:1}
.mini-nota{font-size:11px;color:#8a6b55;margin-top:8px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips button{border:2px solid var(--crema2);background:#fff;border-radius:999px;padding:9px 14px;font:600 14px Inter,sans-serif;color:var(--tinta);cursor:pointer}
.chips button.sel{background:var(--rojo);border-color:var(--rojo);color:var(--crema)}
.cambiar{background:none;border:0;color:var(--rojo3);font:700 12px Inter,sans-serif;text-decoration:underline;cursor:pointer;padding:0;margin-left:4px}
.cargando{text-align:center;padding:30px 0;color:#8a6b55}
.confeti{position:fixed;top:-10px;width:8px;height:12px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

/* ===== Historias de Instagram (?historias=1) ===== */
.igwrap{display:none;padding:24px 12px 40px;justify-content:center;gap:24px;flex-wrap:wrap}
.story{width:360px;height:640px;border-radius:22px;overflow:hidden;position:relative;color:var(--crema);text-align:center;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
  background:
    radial-gradient(circle at 20% 10%,rgba(255,255,255,.08) 0 2px,transparent 3px) 0 0/34px 34px,
    linear-gradient(180deg,var(--rojo3) 0%,var(--rojo) 45%,var(--rojo2) 100%);
  padding:34px 26px;display:flex;flex-direction:column;align-items:center}
.story .logo{width:120px;height:120px}
.story .titulo{font-size:40px;margin-top:12px}
.story .sub{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--oro2);font-weight:700}
.mini{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%;margin:20px 0 16px}
.mini div{aspect-ratio:1;border-radius:6px;background:var(--crema2);color:var(--rojo);display:grid;place-items:center;font:800 15px "Playfair Display",serif}
.mini div:nth-child(3n){background:var(--verde);color:var(--crema)}
.mini div:nth-child(4n+1){background:var(--crema);color:var(--rojo)}
.mini div.hl{background:var(--oro);color:var(--rojo2);box-shadow:0 0 0 2px #fff3cf}
.story .txt{font-size:15px;line-height:1.45}
.story .txt b{color:var(--oro2)}
.sticker{margin-top:auto;background:#fff;color:#3b5bdb;border-radius:10px;padding:9px 16px;font:700 14px Inter,sans-serif;display:inline-flex;gap:6px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.story .fecha{margin-top:12px;font-size:11px;opacity:.75;letter-spacing:.12em;text-transform:uppercase}
.story.dia .big{font-family:"Playfair Display",serif;font-size:150px;line-height:1;color:var(--oro2);margin-top:24px;text-shadow:0 6px 0 rgba(0,0,0,.2)}
.story.dia .reg{width:120px;height:120px;border-radius:18px;background:var(--crema);display:grid;place-items:center;font-size:64px;margin:18px auto;transform:rotate(-6deg);box-shadow:0 8px 0 rgba(0,0,0,.2)}
.cap{color:#ccc;font-size:12px;text-align:center;margin-top:8px}

/* ===== Efectos voladores ===== */
.fx{pointer-events:none;overflow:hidden;z-index:40}
.fx.fijo{position:fixed;top:0;bottom:0;left:50%;width:min(440px,100%);transform:translateX(-50%)}
.fx.abs{position:absolute;inset:0;z-index:0}
.story>*:not(.fx){position:relative;z-index:1}
.fx .obj{position:absolute;left:0;top:0;will-change:transform;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
.fx .obj svg{display:block;width:100%;height:auto}
.fx .star{position:absolute;left:0;top:0;height:2px;border-radius:2px;transform-origin:left center;will-change:transform,opacity;
  background:linear-gradient(90deg,#fff 0%,rgba(255,243,207,.85) 12%,rgba(255,243,207,0) 100%)}
.fx .star::before{content:"";position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px rgba(255,236,170,.9)}
</style>
</head>
<body>

<div class="previa" id="previa">
  <span><b>VISTA PREVIA</b> · simular día:</span>
  <select id="previaDia"></select>
  <span>(no genera códigos ni guarda nada)</span>
</div>

function $(id) { return document.getElementById(id); }
function esc(x) { return String(x ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function addDays(iso, n) { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function diaNum(iso) { return +iso.slice(8, 10); }
function fechaTxt(iso) { const d = new Date(iso + 'T12:00:00Z'); return d.getUTCDate() + ' de ' + MESES[d.getUTCMonth()]; }
function diaSemana(iso) { return DIAS[new Date(iso + 'T12:00:00Z').getUTCDay()]; }
// Criterio Stock MA: 10 dígitos, sin 0, 15, 54 ni 9
function normTel(t) {
  let d = String(t || '').replace(/\D/g, '');
  if (d.startsWith('54')) d = d.slice(2);
  if (d.length === 11 && d.startsWith('9')) d = d.slice(1);
  if (d.startsWith('0')) d = d.slice(1);
  if (d.length === 12) d = d.replace(/^(\d{2,4})15/, '$1');
  return d.length === 10 ? d : null;
}

async function rpc(fn, args) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method: 'POST', headers: H, body: JSON.stringify(args) });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.message || 'Error ' + r.status); }
  return r.json();
}
async function get(path) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: H });
  if (!r.ok) throw new Error('Error ' + r.status);
  return r.json();
}

// ── Datos derivados ────────────────────────────────────────────────
function dias() {
  const out = []; let d = E.campania.desde;
  while (d <= E.campania.hasta && out.length < 62) { out.push(d); d = addDays(d, 1); }
  return out;
}
function pasadoDe(f) { return (E.pasados || []).find(p => p.fecha === f); }
function progreso() {
  const ds = dias(), hoy = E.hoy;
  let ok = 0, miss = 0;
  ds.forEach(f => { if (abiertas.has(f)) ok++; else if (f < hoy) miss++; });
  const total = ds.length;
  const minimo = Math.min(E.campania.sorteo_minimo || total, total);
  return { ok, miss, total, minimo, posible: total - miss >= minimo, adentro: ok >= minimo };
}
// Orden "desordenado" fijo por campaña (siempre igual para todos)
function ordenPuertas(ds) {
  let h = 2166136261; for (const ch of E.campania.slug) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  let s = h >>> 0;
  const rnd = () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const a = ds.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// ── Página ─────────────────────────────────────────────────────────
function tituloHTML(t) {
  const p = String(t || '').trim().split(/\s+/);
  if (p.length < 2) return esc(t);
  const ult = p.pop();
  return esc(p.join(' ')) + ' <i>' + esc(ult) + '</i>';
}

  else if (abiertas.has(hoy)) est = `<span class="ic">✅</span><div>Ya abriste la puerta de hoy. ${hoy === c.hasta ? '<b>¡Era la última!</b>' : '<b>¡Volvé mañana!</b>'}</div>`;
  else est = `<span class="ic">🎁</span><div>Hoy es ${diaSemana(hoy)} ${diaNum(hoy)}: <b>tu puerta ya está lista</b>. Tocala para abrirla.</div>`;

  // Progreso
  let prog = '';
  if (hoy >= c.desde) {

      else msg = `<p class="mal">Te perdiste ${pr.miss} ${pr.miss === 1 ? 'puerta' : 'puertas'}: ya no llegás al ${esc(c.sorteo_texto)}, pero seguís ganando los premios de cada día.</p>`;
    }
    prog = `<div class="prog"><div class="top"><b>${pr.ok} de ${pr.total} puertas</b><span>${esc(c.sorteo_texto || '')}</span></div>
      <div class="seg" style="grid-template-columns:repeat(${pr.total},1fr)">${seg}</div>${msg}</div>`;
  }

  // Puertas
  const orden = ordenPuertas(ds);
  const ultimo = ds[ds.length - 1];
  const conBig = ds.length >= 4;
  let anchas = conBig ? (4 - ((ds.length + 3) % 4)) % 4 : 0;
  const cols = ['c1','c2','c3','','c4','c2','','c1','c3','c4','','c2'];
  let html = '';
  orden.forEach((f, idx) => {
    const cls = ['door', cols[idx % cols.length]];
    if (conBig && f === ultimo) cls.push('big');
    else if (anchas > 0) { cls.push('wide'); anchas--; }
    let inside = '<div class="em">🎁</div>';
    if (f < hoy) {
      cls.push('past'); if (abiertas.has(f)) cls.push('claimed');
      const p = pasadoDe(f);
      inside = p ? `<div class="em">${esc(p.emoji || '🎁')}</div><div class="tx">${esc(p.titulo)}</div>` : '<div class="em">🎁</div>';
    } else if (f === hoy) {
      cls.push('today'); if (abiertas.has(f)) cls.push('open');
      if (premioHoy) inside = `<div class="em">${esc(premioHoy.premio.emoji || '🎁')}</div><div class="tx">${esc(premioHoy.premio.titulo)}</div>`;
    } else cls.push('future');
    const lk = f === hoy ? (abiertas.has(f) ? 'ABIERTA' : '¡HOY!') : (f > hoy ? '🔒' : '');
    const gs = (f === ultimo && c.sorteo_texto && conBig) ? '<div class="gs">SORTEO</div>' : '';
    html += `<div class="${cls.join(' ')}" data-f="${f}"><div class="inside">${inside}</div>
      <div class="front"><div class="n">${diaNum(f)}</div>${gs}<div class="lk">${lk}</div></div></div>`;
  });

  const pasos = [
    'Entrá todos los días: solo se abre la puerta <b>de hoy</b>.',
    'La primera vez dejás tu <b>nombre, celular</b> y la <b>sucursal que te queda más cerca</b>.',
    'Usá tu premio <b>ese mismo día</b>, <b>solo retirando en sucursal</b>: comprás en el local o pedís online con retiro.'
  ];
  if (c.sorteo_texto) pasos.push(`¿Abriste ${pr.minimo >= pr.total ? '<b>todas las puertas</b>' : '<b>al menos ' + pr.minimo + ' puertas</b>'}? Participás del <b>${esc(c.sorteo_texto)}</b> 🎁`);

  $('cuerpo').innerHTML =
    `<div class="estado">${est}</div>${prog}
     <div class="grid${conBig ? '' : ' pocas'}" id="grid" ${conBig ? '' : `style="grid-template-columns:repeat(${ds.length},1fr)"`}>${html}</div>

     ${cliente && !PREVIA ? `<div class="quien">¿No sos ${esc(cliente.nombre)}? <button id="noSoy">Cambiar</button></div>` : ''}`;

  const hoyEl = document.querySelector('.door.today');
  if (hoyEl && enCurso) hoyEl.onclick = () => abrirHoy(hoyEl);
  const ns = $('noSoy');
  if (ns) ns.onclick = () => { try { localStorage.removeItem(LS_CLIENTE); } catch (e) {} location.reload(); };
}

// ── Abrir la puerta ────────────────────────────────────────────────
async function abrirHoy(el) {
  if (premioHoy) { mostrarPremio(premioHoy); return; }
  el.classList.add('opening');
  await sleep(600);
  if (PREVIA) {
    hoja('<div class="cargando">Abriendo…</div>');
    try {
      const p = await get(`promo_premios?campania_id=eq.${E.campania.id}&fecha=eq.${E.hoy}&select=*`);
      if (!p.length) { hojaError('Esta puerta todavía no tiene premio cargado.'); return; }
      const conCod = p[0].tipo === 'pct' || p[0].tipo === 'monto';
      mostrarPremio({ previa: true, fecha: E.hoy, codigo: conCod ? 'VISTA-PREVIA' : null, premio: p[0] });
      confeti();
    } catch (e) { hojaError('No se pudo leer el premio.'); }
    return;
  }
  if (!cliente) { pedirDatos(); return; }
  abrirEnServidor();
}

async function abrirEnServidor() {
  hoja('<div class="cargando">Abriendo tu puerta… 🎁</div>');
  try {
    const r = await rpc('promo_abrir', { p_slug: E.campania.slug, p_tel: cliente.tel, p_nombre: cliente.nombre, p_pdv: cliente.pdv });
    if (!r.ok) {
      const m = { fuera_de_fecha: 'Hoy no hay puerta para abrir.', sin_premio: 'La puerta de hoy todavía se está preparando. Probá en un rato.', telefono: 'Revisá tu celular.', sin_campania: 'La promo no está activa.' };
      hojaError(m[r.error] || 'No pudimos abrir la puerta.');
      return;
    }
    (r.abiertas || []).forEach(f => abiertas.add(f));
    premioHoy = r;
    render();
    mostrarPremio(r);
    confeti();
  } catch (e) { hojaError('No pudimos abrir la puerta. Revisá tu conexión y probá de nuevo.', e.message); }
}

function hoja(html) { $('sheet').innerHTML = '<button class="x" id="cerrar">×</button>' + html; $('ov').classList.add('show'); $('cerrar').onclick = cerrar; }
function hojaError(t, det) { hoja(`<div class="premio"><div class="em">😕</div><h2>Ups</h2><p>${esc(t)}</p>${det ? `<div class="mini-nota" style="opacity:.7">Detalle: ${esc(det)}</div>` : ''}</div><button class="btn borde" id="ok2">Cerrar</button>`); $('ok2').onclick = cerrar; }
function cerrar() { $('ov').classList.remove('show'); render(); }
$('ov').onclick = ev => { if (ev.target.id === 'ov') cerrar(); };

function chipsSucursal(actual) {
  if (!SUCS.length) return `<input id="pdvTxt" type="text" placeholder="Ej: San Martín" value="${esc(actual || '')}">`;
  return '<div class="chips" id="chips">' + SUCS.map(x => `<button type="button" data-v="${esc(x)}"${x === actual ? ' class="sel"' : ''}>📍 ${esc(x)}</button>`).join('') + '</div>';
}
function activarChips(cb) {
  const ch = $('chips'); if (!ch) return;
  const bs = ch.querySelectorAll('button');
  bs.forEach(b => b.onclick = () => { bs.forEach(o => o.classList.remove('sel')); b.classList.add('sel'); cb(b.getAttribute('data-v')); });
}

function pedirDatos() {
  hoja(`<div class="dia">Puerta del ${fechaTxt(E.hoy)}</div>
    <h2>¡Casi! Falta un paso 🎁</h2>
    <p>Dejanos tu nombre y celular <b>(solo esta vez)</b>. Con tu celular te reconocemos en el local, en la tienda online${E.campania.sorteo_texto ? ' y en el sorteo' : ''}.</p>
    <div class="inp"><label>Tu nombre</label><input id="nom" type="text" placeholder="Ej: María" autocomplete="given-name"></div>
    <div class="inp"><label>Tu celular (con código de área, sin 0 ni 15)</label><input id="cel" type="tel" inputmode="numeric" placeholder="Ej: 11 2345 6789" autocomplete="tel"></div>
    <div class="inp"><label>¿Qué sucursal te queda más cerca?</label>${chipsSucursal('')}</div>
    <div class="err" id="err"></div>
    <button class="btn rojo" id="ok">Ver mi sorpresa</button>`);
  let pdv = '';
  activarChips(v => { pdv = v; });
  $('ok').onclick = () => {
    const nom = $('nom').value.trim();
    const tel = normTel($('cel').value);
    if ($('pdvTxt')) pdv = $('pdvTxt').value.trim();
    if (nom.length < 2) { $('err').textContent = 'Poné tu nombre.'; return; }
    if (!tel) { $('err').textContent = 'Revisá el número: tienen que ser 10 dígitos (ej. 11 2345 6789).'; return; }
    if (!pdv) { $('err').textContent = 'Elegí la sucursal que te queda más cerca.'; return; }
    cliente = { nombre: nom.charAt(0).toUpperCase() + nom.slice(1), tel, pdv };
    guardarCliente();
    abrirEnServidor();
  };
  setTimeout(() => { const n = $('nom'); if (n) n.focus(); }, 300);

function mostrarPremio(r) {
  const c = E.campania, p = r.premio, conCodigo = !!r.codigo;
  const pdv = (cliente && cliente.pdv) || '';
  const tel = (cliente && cliente.tel) || '';
  let cuerpo = p.descripcion ? `<p>${esc(p.descripcion)}</p>` : '';
  if (r.fecha === c.hasta && c.sorteo_texto && !r.previa) {
    const pr = progreso();
    cuerpo += pr.adentro
      ? `<p style="margin-top:8px"><b>¡Abriste ${pr.ok} de ${pr.total} puertas!</b> Ya estás participando del ${esc(c.sorteo_texto)}. Si ganás, te avisamos por WhatsApp.</p>`
      : `<p style="margin-top:8px">Abriste ${pr.ok} de ${pr.total} puertas, así que esta vez no entrás al ${esc(c.sorteo_texto)}. ¡Gracias por acompañarnos!</p>`;
  }
  hoja(`<div class="premio">
      ${cliente && !r.previa ? `<div class="hola">¡Bien, ${esc(cliente.nombre)}!</div>` : ''}
      <div class="dia">Puerta del ${fechaTxt(r.fecha)}</div>
      <div class="em">${esc(p.emoji || '🎁')}</div>
      <h2>${esc(p.titulo)}</h2>${cuerpo}
      ${conCodigo ? `<div class="code">${esc(r.codigo)}</div><div class="vence">Válido solo hoy hasta las 23:59</div>` : ''}
    </div>
    ${conCodigo ? `<div class="donde" id="donde">
      <div><span class="i">📍</span><div><b>Válido solo retirando en sucursal.</b><br>Tu sucursal: <b>${esc(pdv || '—')}</b>${r.previa ? '' : '<button class="cambiar" id="cambiarPdv">cambiar</button>'}</div></div>
      <div><span class="i">🏪</span><div><b>En el local:</b> mostrá este código o decí tu celular${tel ? ' terminado en <b>' + tel.slice(-4) + '</b>' : ''}.</div></div>
      <div><span class="i">🛒</span><div><b>Online:</b> hacé tu pedido eligiendo <b>retiro en sucursal</b> y cargá el código al pagar.</div></div>
    </div>` : ''}
    ${conCodigo ? '<a class="btn verde" href="pedidos.html" style="display:block;text-align:center;text-decoration:none">🛒 Pedir online para retirar</a>' : ''}
    <button class="btn borde" id="comp">Compartir con alguien 💌</button>
    ${conCodigo ? '<div class="mini-nota">Sacale una captura para tenerlo a mano en el local 📸</div>' : ''}`);
  $('comp').onclick = compartir;
  const cp = $('cambiarPdv');
  if (cp) cp.onclick = () => {
    $('donde').innerHTML = '<div style="display:block"><b>¿Qué sucursal te queda más cerca?</b>' + chipsSucursal(pdv) + '</div>';
    activarChips(v => { cliente.pdv = v; guardarCliente(); mostrarPremio(r); });
  };
}

function compartir() {
  const url = location.origin + location.pathname;
  const txt = `¡Mirá la promo de Miguel Ángel Pastas! Todos los días una puerta con sorpresa 🎁 ${url}`;
  if (navigator.share) navigator.share({ title: E.campania.nombre, text: txt, url }).catch(() => {});
  else location.href = 'https://wa.me/?text=' + encodeURIComponent(txt);
}

function confeti() {
  const cols = ['#d6a640','#f3d48a','#c42a31','#2d6a4c','#fbf4e6'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confeti';
    c.style.left = (Math.random() * 100) + 'vw';
    c.style.background = cols[i % cols.length];
    c.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
    c.style.animationDelay = (Math.random() * .4) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3800);
  }
}

  w.innerHTML = `

      <img class="logo" src="${$('vistaPagina').querySelector('.logo').src}" alt="">

      <div class="mini" style="grid-template-columns:repeat(${Math.min(ds.length, 6)},${ds.length < 6 ? '56px' : '1fr'});justify-content:center">${ds.map((f, i) => `<div class="${i === 0 ? 'hl' : ''}">${diaNum(f)}</div>`).join('')}</div>
      <p class="txt">Del <b>${fechaTxt(c.desde)}</b> al <b>${fechaTxt(c.hasta)}</b><br>abrí una puerta por día y<br>descubrí tu sorpresa 🎁</p>
      ${c.sorteo_texto ? `<p class="txt" style="margin-top:10px;font-size:13px">Abrí todas y participás del<br><b>${esc(c.sorteo_texto.toUpperCase())}</b></p>` : ''}
      <div class="sticker">🔗 ABRÍ TU PUERTA</div>
      <div class="fecha">Link en la historia</div>
    </div><div class="cap">Historia de lanzamiento</div></div>
    <div><div class="story dia">
      <div class="sub">${esc(c.nombre)}</div>
      <div class="big">${diaNum(nd)}</div>
      <div class="reg">${esc(p && p.emoji ? p.emoji : '🎁')}</div>
      <p class="txt"><b>La puerta de hoy ya está abierta.</b><br>¿Qué hay adentro? Entrá y descubrilo.</p>
      <div class="sticker">🔗 VER PUERTA DE HOY</div>
      <div class="fecha">Solo por hoy</div>
    </div><div class="cap">Historia diaria (cambia el número)</div></div>`;
  iniciarEfectos();
}

// ── Efectos voladores (según el tema) ──────────────────────────────
const SVG = {
  palo: '<svg viewBox="0 0 120 28"><rect x="0" y="9" width="22" height="10" rx="5" fill="#8b5a2b"/><rect x="98" y="9" width="22" height="10" rx="5" fill="#8b5a2b"/><rect x="18" y="3" width="84" height="22" rx="11" fill="#e6bd80" stroke="#a87437" stroke-width="2"/><path d="M30 8 Q60 5 90 8" stroke="#f7e0b5" stroke-width="3" fill="none" stroke-linecap="round"/></svg>',
  ravioli: '<svg viewBox="0 0 40 40"><rect x="2" y="2" width="36" height="36" rx="4" fill="#f2d78f" stroke="#ddb558" stroke-width="3" stroke-dasharray="3 2"/><rect x="9" y="9" width="22" height="22" rx="9" fill="#f9e6b0"/><ellipse cx="15" cy="14" rx="4" ry="3" fill="#fff7dc" opacity=".85"/></svg>',
  etiqueta: (fondo, letra, txt) => `<svg viewBox="0 0 64 36"><path d="M2 18 L15 3 H59 a3 3 0 0 1 3 3 V30 a3 3 0 0 1-3 3 H15 Z" fill="${fondo}" stroke="#f3d48a" stroke-width="1.5"/><circle cx="14" cy="18" r="3.5" fill="#000" stroke="#f3d48a" stroke-width="1"/><text x="39" y="24.5" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="${txt.length > 2 ? 14 : 18}" fill="${letra}" text-anchor="middle">${txt}</text></svg>`,
  regalo: (caja, tapa, cinta) => `<svg viewBox="0 0 40 40"><rect x="4" y="16" width="32" height="22" rx="3" fill="${caja}"/><rect x="2" y="10" width="36" height="9" rx="2" fill="${tapa}"/><rect x="17" y="10" width="6" height="28" fill="${cinta}"/><path d="M20 10 C12 1 5 8 12 10 Z M20 10 C28 1 35 8 28 10 Z" fill="${cinta}"/></svg>`
};
const REGALOS = [['#2d6a4c','#1f4d36','#f3d48a'],['#fbf4e6','#f1e4c8','#c42a31'],['#d6a640','#b8862a','#9e1b22']];
const TEMAS = {
  navidad:  { objetos: ['palo','ravioli','ravioli','regalo','regalo'], estrellas: true },
  generico: { objetos: ['palo','ravioli','ravioli','ravioli'], estrellas: false },
  blackfriday: { objetos: ['etiqueta','etiqueta','etiqueta','ravioli','palo'], estrellas: false }
};
function rnd(a, b) { return a + Math.random() * (b - a); }
function lanzarObjeto(capa, tema) {
  const W = capa.clientWidth, Hh = capa.clientHeight;
  if (!W || !Hh || capa.childElementCount > 9) return;
  const tipo = tema.objetos[Math.floor(Math.random() * tema.objetos.length)];
  const el = document.createElement('div'); el.className = 'obj';
  let w;
  if (tipo === 'palo') { el.innerHTML = SVG.palo; w = rnd(60, 84); }
  else if (tipo === 'ravioli') { el.innerHTML = SVG.ravioli; w = rnd(24, 36); }
  else if (tipo === 'etiqueta') {
    const v = [['#d6a640', '#111', '%'], ['#111', '#f3d48a', '%'], ['#d6a640', '#111', 'OFF'], ['#111', '#f3d48a', 'SALE']][Math.floor(Math.random() * 4)];
    el.innerHTML = SVG.etiqueta(v[0], v[1], v[2]); w = rnd(48, 68);
  }
  else { const c = REGALOS[Math.floor(Math.random() * REGALOS.length)]; el.innerHTML = SVG.regalo(c[0], c[1], c[2]); w = rnd(28, 40); }
  el.style.width = w + 'px';
  capa.appendChild(el);
  const izq = Math.random() < .5;
  const x0 = izq ? -w - 10 : W + 10, x1 = izq ? W + 10 : -w - 10;
  const y0 = rnd(Hh * .05, Hh * .9), y1 = y0 + rnd(-Hh * .25, Hh * .25);
  const giro = rnd(180, 540) * (izq ? 1 : -1), ola = rnd(15, 40), frames = [];
  for (let i = 0; i <= 10; i++) {
    const t = i / 10;
    frames.push({ transform: `translate(${x0 + (x1 - x0) * t}px,${y0 + (y1 - y0) * t + Math.sin(t * Math.PI * 2) * ola}px) rotate(${giro * t}deg)` });
  }
  const a = el.animate(frames, { duration: rnd(6000, 10000), easing: 'linear' });
  a.onfinish = () => el.remove();
}
function lanzarEstrella(capa) {
  const W = capa.clientWidth, Hh = capa.clientHeight;
  if (!W || !Hh) return;
  const el = document.createElement('div'), largo = rnd(80, 150), ang = rnd(20, 35);
  el.className = 'star'; el.style.width = largo + 'px';
  capa.appendChild(el);
  const x0 = rnd(W * .3, W + 40), y0 = rnd(-20, Hh * .45), dist = rnd(220, 380);
  const rad = ang * Math.PI / 180, dx = -Math.cos(rad) * dist, dy = Math.sin(rad) * dist;
  const a = el.animate([
    { transform: `translate(${x0}px,${y0}px) rotate(${-ang}deg)`, opacity: 0 },
    { opacity: 1, offset: .15 }, { opacity: 1, offset: .7 },
    { transform: `translate(${x0 + dx}px,${y0 + dy}px) rotate(${-ang}deg)`, opacity: 0 }
  ], { duration: rnd(900, 1400), easing: 'cubic-bezier(.4,0,.8,.6)' });
  a.onfinish = () => el.remove();
}
let _fx = false;
function iniciarEfectos() {
  if (_fx || !E || !E.campania) return;
  if ((window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) || !Element.prototype.animate) return;
  _fx = true;
  const tema = TEMAS[E.campania.tema] || TEMAS.navidad;
  const capas = [];
  if (HISTORIAS) document.querySelectorAll('.story').forEach(s => { const c = document.createElement('div'); c.className = 'fx abs'; s.appendChild(c); capas.push(c); });
  else { const c = document.createElement('div'); c.className = 'fx fijo'; document.body.appendChild(c); capas.push(c); }
  const tick = (fn, min, max) => setTimeout(() => { if (!document.hidden) capas.forEach(c => fn(c, tema)); tick(fn, min, max); }, rnd(min, max));
  tick(lanzarObjeto, 900, 1800);
  if (tema.estrellas) tick(lanzarEstrella, 1800, 3800);
  for (let k = 0; k < 3; k++) capas.forEach(c => lanzarObjeto(c, tema));
}

// ── Vista previa ───────────────────────────────────────────────────
function armarPrevia() {
  if (!PREVIA || !E || !E.campania) return;
  $('previa').style.display = 'flex';
  const sel = $('previaDia');
  sel.innerHTML = dias().map(f => `<option value="${f}">${diaSemana(f)} ${fechaTxt(f)}</option>`).join('');
  sel.value = PREVIA;
  sel.onchange = async () => { PREVIA = sel.value; premioHoy = null; await cargar(); };
}

// ── Inicio ─────────────────────────────────────────────────────────
(async function init() {
  cliente = leerCliente();
  await Promise.all([cargar(), cargarSucursales()]);
  armarPrevia();
  if (!HISTORIAS) iniciarEfectos();
})();
</script>
